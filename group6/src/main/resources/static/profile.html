<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>LearnHub - My Learning</title>
</head>
<body>
<main class="flex-grow-1 container py-5">
 <div class="row g-4 mb-5">
  <div class="col-md-6"><form id="info" class="glass p-4 h-100">
   <h4 class="mb-3">My Profile <span id="role" class="badge bg-info align-middle fs-6"></span></h4>
   <label class="form-label small">Full name</label><input name="fullName" class="form-control mb-2" maxlength="100" required>
   <label class="form-label small">Email</label><input name="email" class="form-control mb-3" disabled>
   <button class="btn btn-primary">Save changes</button></form></div>
  <div class="col-md-6"><form id="pw" class="glass p-4 h-100">
   <h4 class="mb-3">Change Password</h4>
   <input name="currentPassword" type="password" class="form-control mb-2" placeholder="Current password" required>
   <input name="newPassword" type="password" class="form-control mb-2" placeholder="New password (min 6)" minlength="6" required>
   <input name="confirm" type="password" class="form-control mb-3" placeholder="Confirm new password" required>
   <button class="btn btn-primary">Update password</button></form></div>
 </div>
 <div id="learning" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h4 class="mb-0">My Learning</h4>
  <select id="mySort" class="form-select form-select-sm w-auto">
   <option value="prog">Sort: In progress first</option><option value="comp">Sort: Completed first</option><option value="recent">Sort: Recently enrolled</option><option value="title">Sort: Title A–Z</option>
  </select>
 </div>
 <div id="myTabs" class="d-flex flex-wrap gap-2 mb-3"></div>
 <div id="myList" class="row g-4"></div>
 <div id="nextBox" class="mt-5"></div>
</main>

<div class="modal fade" id="certModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
 <div class="modal-header"><h5 class="modal-title"><i class="bi bi-award-fill text-warning"></i> Certificate of completion</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body" id="certBody"></div>
 <div class="modal-footer"><button class="btn btn-primary" id="certPrint"><i class="bi bi-printer"></i> Download / Print</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
if (guard()) {
  let all = [], courses = [], tab = 'all';
  const stat = e => isDone(e) ? 'comp' : 'prog';
  const tot = e => e.totalLessons + (e.totalQuizzes || 0), dn = e => e.completedLessons + (e.passedQuizzes || 0);
  const pctOf = e => tot(e) ? Math.round(dn(e) / tot(e) * 100) : 0;
  function drawMine() {
    const n = { all: all.length, prog: all.filter(e => !isDone(e)).length, comp: all.filter(isDone).length };
    $('#myTabs').innerHTML = [['all', 'All'], ['prog', 'In progress'], ['comp', 'Completed']].map(([k, t]) =>
      '<button class="chip' + (tab === k ? ' active' : '') + '" data-tab="' + k + '">' + t + ' (' + n[k] + ')</button>').join('');
    const so = $('#mySort').value, l = all.filter(e => tab === 'all' || stat(e) === tab);
    const byStatus = f => (a, b) => (stat(a) === f ? -1 : 0) - (stat(b) === f ? -1 : 0) || pctOf(b) - pctOf(a);
    l.sort(so === 'comp' ? byStatus('comp') : so === 'recent' ? (a, b) => new Date(b.enrolledAt) - new Date(a.enrolledAt) : so === 'title' ? (a, b) => a.title.localeCompare(b.title) : byStatus('prog'));
    $('#myList').innerHTML = l.map(e => { const p = pctOf(e), d = isDone(e);
      return '<div class="col-md-6"><div class="glass p-3 d-flex gap-3 align-items-center"><a href="course.html?id=' + e.courseId + '" class="thumb ' + catClass(e.category) + '">' + imgTag(e) + '</a>' +
        '<div class="flex-grow-1"><a href="course.html?id=' + e.courseId + '" class="text-reset text-decoration-none"><h6 class="mb-1">' + esc(e.title) + '</h6></a><small class="text-secondary">' + esc(e.instructor) + '</small> ' +
        (d ? '<span class="badge bg-success ms-1"><i class="bi bi-patch-check-fill"></i> Completed</span>' : '<span class="badge bg-warning text-dark ms-1">In progress</span>') +
        '<div class="progress my-2" style="height:6px"><div class="progress-bar' + (d ? ' bg-success' : '') + '" style="width:' + p + '%"></div></div><small>' + e.completedLessons + '/' + e.totalLessons + ' lessons · ' + (e.passedQuizzes || 0) + '/' + (e.totalQuizzes || 0) + ' quizzes · ' + p + '%' + (d ? ' 🎉' : '') + '</small></div>' +
        '<div class="d-grid gap-1">' + (d ? '<button class="btn btn-sm btn-success" data-cert="' + e.enrollmentId + '"><i class="bi bi-award-fill"></i> Certificate</button><a class="btn btn-sm btn-outline-light" href="learn.html?id=' + e.courseId + '">Review</a>'
          : '<a class="btn btn-sm btn-primary" href="learn.html?id=' + e.courseId + '">' + (p ? 'Continue' : 'Start') + '</a>') +
        '<button class="btn btn-sm btn-outline-danger" data-del="' + e.enrollmentId + '">Unenroll</button></div></div></div>'; }).join('')
      || '<p class="text-secondary">' + (all.length ? 'No ' + (tab === 'comp' ? 'completed' : 'in-progress') + ' courses yet.' : 'You have not enrolled in any course yet. <a href="index.html#courses">Browse courses</a>') + '</p>';
    const sug = suggestNext(courses, all, 3);
    $('#nextBox').innerHTML = sug.length ? '<h4 class="mb-3"><i class="bi bi-lightbulb"></i> Suggested next courses</h4><div class="row g-4">' + sug.map(x => sugCard(x.c, x.why)).join('') + '</div>' : '';
  }
  async function loadMine() {
    try { [all, courses] = await Promise.all([api('/enrollments/me'), api('/courses')]); drawMine(); }
    catch (x) { toast(x.message || 'Failed to load', 'danger'); }
  }
  $('#myTabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; drawMine(); } };
  $('#mySort').onchange = drawMine;
  $('#certPrint').onclick = () => printCertificate($('#certModal').cert);
  $('#myList').onclick = async e => {
    const c = e.target.closest('[data-cert]');
    if (c) { const en = all.find(x => x.enrollmentId === +c.dataset.cert); $('#certModal').cert = en; $('#certBody').innerHTML = certificateHtml(en); return bootstrap.Modal.getOrCreateInstance('#certModal').show(); }
    const b = e.target.closest('[data-del]'); if (!b) return;
    if (!await confirmBox('Unenroll from this course? Your progress will be lost.', { title: 'Unenroll?', confirmText: 'Unenroll' })) return;
    try { await api('/enrollments/' + b.dataset.del, 'DELETE'); toast('Unenrolled', 'info'); loadMine(); } catch (x) { toast(x.message || 'Failed', 'danger'); }
  };
  $('#info').onsubmit = async e => {
    e.preventDefault();
    try { const u = await api('/users/me', 'PUT', { fullName: e.target.fullName.value }); setSession(u, state.token); flash('Profile updated!'); location.reload(); }
    catch (x) { toast(x.message || 'Update failed', 'danger'); }
  };
  $('#pw').onsubmit = async e => {
    e.preventDefault(); const d = formData(e.target);
    if (d.newPassword !== d.confirm) return toast('Passwords do not match', 'danger');
    try { await api('/users/me/password', 'PUT', { currentPassword: d.currentPassword, newPassword: d.newPassword }); e.target.reset(); toast('Password updated!'); }
    catch (x) { toast(x.message || 'Update failed', 'danger'); }
  };
  (async () => {
    try { const u = await api('/users/me'); $('#info').fullName.value = u.fullName; $('#info').email.value = u.email; $('#role').textContent = u.role; }
    catch (x) { toast(x.message || 'Failed to load profile', 'danger'); }
    loadMine();
  })();
}
</script>
</body>
</html>
