<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>LearnHub - Admin</title>
</head>
<body>
<main class="flex-grow-1 container py-5">
 <div class="d-flex align-items-center gap-2 mb-4"><h2 class="mb-0">Admin Dashboard</h2><span class="admin-pill"><i class="bi bi-shield-fill-check"></i> ADMIN</span></div>
 <ul class="nav nav-pills gap-2 mb-4">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#t-dash"><i class="bi bi-speedometer2"></i> Dashboard</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#t-courses"><i class="bi bi-journal-richtext"></i> Courses</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#t-users"><i class="bi bi-people"></i> Users</button></li>
 </ul>
 <div class="tab-content">
  <div class="tab-pane fade show active" id="t-dash">
   <div class="row g-3 mb-4" id="stats"></div>
   <div class="row g-4">
    <div class="col-lg-5"><div class="glass p-4 h-100"><h5 class="mb-3">Top courses</h5><div id="top"></div></div></div>
    <div class="col-lg-7"><div class="glass p-4 h-100"><h5 class="mb-3">Recent enrollments</h5><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Student</th><th>Course</th><th>Amount</th><th>Method</th></tr></thead><tbody id="recent"></tbody></table></div></div></div>
   </div>
   <p class="small text-secondary mt-3 mb-0">Demo data: revenue and student counts include sample enrollments.</p>
  </div>
  <div class="tab-pane fade" id="t-courses">
   <div class="d-flex flex-wrap gap-2 justify-content-between mb-3"><input id="cq" class="form-control" style="max-width:320px" placeholder="Search courses...">
    <button class="btn btn-primary" id="add"><i class="bi bi-plus-lg"></i> New Course</button></div>
   <div class="glass p-2 table-responsive"><table class="table align-middle mb-0">
    <thead><tr><th>Title</th><th>Category</th><th>Level</th><th>Price</th><th>Students</th><th></th></tr></thead><tbody id="body"></tbody></table></div>
  </div>
  <div class="tab-pane fade" id="t-users">
   <div class="mb-3"><input id="uq" class="form-control" style="max-width:320px" placeholder="Search users..."></div>
   <div class="glass p-2 table-responsive"><table class="table align-middle mb-0">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Courses</th><th></th></tr></thead><tbody id="userBody"></tbody></table></div>
  </div>
 </div>
</main>

<div class="modal fade" id="formModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
 <form id="f">
  <div class="modal-header"><h5 class="modal-title" id="fTitle">New Course</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body row g-2">
   <input type="hidden" name="courseId">
   <div class="col-12"><input name="title" class="form-control" placeholder="Course title" maxlength="150" required></div>
   <div class="col-md-6"><select name="category" class="form-select" id="fCat" required></select></div>
   <div class="col-md-6"><select name="level" class="form-select"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
   <div class="col-md-6"><input name="instructor" class="form-control" placeholder="Instructor" maxlength="100" required></div>
   <div class="col-md-6"><input name="language" class="form-control" placeholder="Language" value="English" maxlength="30"></div>
   <div class="col-4"><input name="durationHours" type="number" min="0" class="form-control" placeholder="Hours" required></div>
   <div class="col-4"><input name="price" type="number" min="0" class="form-control" placeholder="Price (VND, 0 = free)" required></div>
   <div class="col-4"><input name="rating" type="number" min="0" max="5" step="0.1" class="form-control" placeholder="Rating"></div>
   <div class="col-12"><input name="imageUrl" class="form-control" placeholder="Image URL (optional)" maxlength="500"></div>
   <div class="col-12"><textarea name="description" rows="2" class="form-control" placeholder="Short description"></textarea></div>
   <div class="col-12"><textarea name="details" rows="4" class="form-control font-monospace small" placeholder='Details JSON (optional): {"tagline":"","learn":[],"requirements":[],"skills":[],"instructorBio":"","curriculum":[{"title":"Section","lessons":[{"title":"Lesson","minutes":10}]}]}'></textarea></div>
  </div>
  <div class="modal-footer"><button class="btn btn-primary">Save</button></div>
 </form></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
if (guard('ADMIN')) {
  let courses = [], users = [];
  const modal = () => bootstrap.Modal.getOrCreateInstance('#formModal');
  const vnd = n => n ? money(n) : '0 ₫';
  $('#fCat').innerHTML = CATS.map(c => '<option>' + c + '</option>').join('');

  async function loadStats() {
    try {
      const s = await api('/admin/stats');
      $('#stats').innerHTML = [['Courses', s.courses, 'bi-journal-richtext'], ['Users', s.users, 'bi-people'], ['Enrollments', s.enrollments, 'bi-bag-check'], ['Revenue', vnd(s.revenue), 'bi-cash-coin']].map(x =>
        '<div class="col-6 col-lg-3"><div class="glass p-3 d-flex align-items-center gap-3"><span class="step-icon m-0 flex-none" style="width:52px;height:52px;font-size:1.3rem"><i class="bi ' + x[2] + '"></i></span><div><div class="fs-5 fw-bold">' + x[1] + '</div><small class="text-secondary">' + x[0] + '</small></div></div></div>').join('');
      const max = Math.max(1, ...s.topCourses.map(c => c.enrolled));
      $('#top').innerHTML = s.topCourses.map(c => '<div class="mb-3"><div class="d-flex justify-content-between small"><span>' + esc(c.title) + '</span><span class="text-secondary">' + c.enrolled + ' students</span></div><div class="progress" style="height:6px"><div class="progress-bar" style="width:' + c.enrolled / max * 100 + '%"></div></div></div>').join('');
      $('#recent').innerHTML = s.recent.map(r => '<tr><td>' + esc(r.student) + '</td><td>' + esc(r.courseTitle) + '</td><td>' + vnd(r.amount) + '</td><td><span class="badge bg-secondary">' + esc(r.method || 'FREE') + '</span></td></tr>').join('');
    } catch (x) { toast(x.message || 'Failed to load stats', 'danger'); }
  }

  function renderCourses() {
    const q = $('#cq').value.toLowerCase();
    $('#body').innerHTML = courses.filter(c => (c.title + ' ' + c.instructor + ' ' + c.category).toLowerCase().includes(q)).map(c => '<tr><td>' + esc(c.title) + '</td><td>' + esc(c.category) + '</td><td>' + esc(c.level) + '</td><td>' + money(c.price) + '</td><td>' + c.enrolledCount +
      '</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-light" href="course.html?id=' + c.courseId + '" title="View"><i class="bi bi-eye"></i></a> <button class="btn btn-sm btn-outline-info" data-act="edit" data-id="' + c.courseId + '"><i class="bi bi-pencil"></i></button> ' +
      '<button class="btn btn-sm btn-outline-danger" data-act="del" data-id="' + c.courseId + '"><i class="bi bi-trash"></i></button></td></tr>').join('');
  }
  async function loadCourses() { try { courses = await api('/courses'); } catch (x) { toast(x.message || 'Failed to load', 'danger'); } renderCourses(); }

  function renderUsers() {
    const q = $('#uq').value.toLowerCase();
    $('#userBody').innerHTML = users.filter(u => (u.fullName + ' ' + u.email).toLowerCase().includes(q)).map(u => {
      const me = String(u.userId) === String(state.user.userId), adm = u.role === 'ADMIN';
      return '<tr><td>' + esc(u.fullName) + (me ? ' <span class="badge bg-info text-dark">You</span>' : '') + '</td><td>' + esc(u.email) + '</td><td>' + (adm ? '<span class="admin-pill ms-0">ADMIN</span>' : '<span class="badge bg-secondary">USER</span>') + '</td><td>' + u.enrollments + '</td><td class="text-end text-nowrap">' +
        (me ? '' : '<button class="btn btn-sm ' + (adm ? 'btn-outline-warning' : 'btn-outline-info') + '" data-act="role" data-id="' + u.userId + '" data-role="' + (adm ? 'USER' : 'ADMIN') + '">' + (adm ? 'Remove admin' : 'Make admin') + '</button> <button class="btn btn-sm btn-outline-danger" data-act="udel" data-id="' + u.userId + '"><i class="bi bi-trash"></i></button>') + '</td></tr>'; }).join('');
  }
  async function loadUsers() { try { users = await api('/admin/users'); } catch (x) { toast(x.message || 'Failed to load users', 'danger'); } renderUsers(); }

  function openForm(id) {
    const f = $('#f'), c = id ? courses.find(x => x.courseId == id) : null; f.reset();
    $('#fTitle').textContent = c ? 'Edit Course' : 'New Course';
    if (c) { for (const k of ['courseId', 'title', 'category', 'level', 'instructor', 'language', 'durationHours', 'price', 'rating', 'imageUrl', 'description']) f.elements[k].value = c[k] ?? '';
      f.elements.details.value = c.details ? (typeof c.details === 'string' ? c.details : JSON.stringify(c.details)) : ''; }
    modal().show();
  }
  $('#add').onclick = () => openForm();
  $('#cq').oninput = renderCourses; $('#uq').oninput = renderUsers;

  $('#body').onclick = async ev => {
    const t = ev.target.closest('[data-act]'); if (!t) return;
    if (t.dataset.act === 'edit') return openForm(t.dataset.id);
    if (!await confirmBox('Delete this course and all its enrollments? This cannot be undone.', { title: 'Delete course', confirmText: 'Delete' })) return;
    try { await api('/courses/' + t.dataset.id, 'DELETE'); toast('Course deleted', 'info'); loadCourses(); loadStats(); } catch (x) { toast(x.message || 'Delete failed', 'danger'); }
  };

  $('#userBody').onclick = async ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return; const id = b.dataset.id;
    try {
      if (b.dataset.act === 'role') {
        const up = b.dataset.role === 'ADMIN';
        if (!await confirmBox(up ? 'Give this user full admin access?' : 'Remove admin access from this user?', { title: up ? 'Promote to admin' : 'Remove admin', confirmText: up ? 'Promote' : 'Remove', danger: !up })) return;
        await api('/admin/users/' + id + '/role', 'PUT', { role: b.dataset.role }); toast(up ? 'User is now an admin' : 'Admin access removed');
      } else {
        if (!await confirmBox('Delete this user and all their enrollments? This cannot be undone.', { title: 'Delete user', confirmText: 'Delete' })) return;
        await api('/admin/users/' + id, 'DELETE'); toast('User deleted', 'info');
      }
      loadUsers(); loadStats();
    } catch (x) { toast(x.message || 'Failed', 'danger'); }
  };

  $('#f').onsubmit = async ev => {
    ev.preventDefault(); const d = formData(ev.target);
    let details = null; try { details = d.details.trim() ? JSON.parse(d.details) : null; } catch { return toast('Details must be valid JSON', 'danger'); }
    const body = { title: d.title, category: d.category, level: d.level, instructor: d.instructor, language: d.language || 'English', durationHours: +d.durationHours || 0,
      price: +d.price || 0, rating: +d.rating || 0, imageUrl: d.imageUrl || null, description: d.description, details };
    try {
      d.courseId ? await api('/courses/' + d.courseId, 'PUT', body) : await api('/courses', 'POST', body);
      modal().hide(); toast(d.courseId ? 'Course updated!' : 'Course created!'); loadCourses(); loadStats();
    } catch (x) { toast(x.message || 'Save failed', 'danger'); }
  };
  loadStats(); loadCourses(); loadUsers();
}
</script>
</body>
</html>
