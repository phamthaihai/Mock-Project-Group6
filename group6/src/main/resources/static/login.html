<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>LearnHub - Login</title></head>
<body>
<main class="flex-grow-1 d-flex align-items-center py-5"><div class="container" style="max-width:440px">
 <form id="f" class="glass p-4">
  <h2 class="mb-3">Login</h2>
  <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
  <input name="password" type="password" class="form-control mb-3" placeholder="Password" required>
  <button class="btn btn-primary w-100">Login</button>
  <p class="small mt-3 mb-1">No account? <a href="signup.html">Sign up</a></p>
  <p class="small text-secondary mb-0">Demo admin: admin@learnhub.com / admin123</p>
 </form></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
if (state.user) location.href = 'index.html';
$('#f').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await api('/auth/login', 'POST', formData(e.target));
    setSession(r.user, r.token); flash('Welcome to home page!');
    const n = new URLSearchParams(location.search).get('next');
    location.href = n && /^[\w.\-]+\.html(\?[\w=&%.\-]*)?$/.test(n) ? n : 'index.html';
  } catch (x) { toast(x.message || 'Login failed', 'danger'); }
};
</script></body></html>
