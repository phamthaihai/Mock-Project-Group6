<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventHub - Event</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<main class="flex-grow-1" id="page"><div class="text-center p-5"><div class="spinner-border"></div></div></main>

<div class="modal fade" id="payModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
 <div class="modal-header"><h5 class="modal-title">Checkout</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body">
  <div id="payBody" class="mb-3"></div>
  <label class="form-label small text-secondary">Payment method</label>
  <div class="form-check"><input class="form-check-input" type="radio" name="pm" id="pm1" value="CARD" checked><label class="form-check-label" for="pm1">Credit / debit card</label></div>
  <div class="form-check"><input class="form-check-input" type="radio" name="pm" id="pm2" value="EWALLET"><label class="form-check-label" for="pm2">E-wallet</label></div>
  <div class="form-check"><input class="form-check-input" type="radio" name="pm" id="pm3" value="BANK"><label class="form-check-label" for="pm3">Bank transfer</label></div>
  <p class="small text-secondary mt-3 mb-0">Demo checkout: no real payment is taken.</p>
 </div>
 <div class="modal-footer"><button class="btn btn-primary" id="payConfirm">Confirm &amp; pay</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let ev, taken = new Map(), sel = new Set(), qty = 1;
const seated = () => ev.seatRows > 0;
const sortedSel = () => [...sel].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
const total = () => seated() ? [...sel].reduce((t, s) => t + seatPrice(ev, s), 0) : qty * ev.price;

function sectionHtml(s) {
    const icon = { people: 'people', timeline: 'clock-history', list: 'stars', tags: 'building' }[s.type] || 'info-circle';
    let body = '';
    if (s.type === 'people') body = '<div class="row g-3">' + s.items.map(p => '<div class="col-sm-6"><div class="person"><span class="avatar">' + esc(p.name.split(' ').map(w => w[0]).slice(0, 2).join('')) + '</span><div><div class="fw-semibold">' + esc(p.name) + '</div><small class="text-secondary">' + esc(p.role) + '</small></div></div></div>').join('') + '</div>';
    else if (s.type === 'timeline') body = '<ul class="timeline">' + s.items.map(t => '<li><b>' + esc(t.time) + '</b><span>' + esc(t.text) + '</span></li>').join('') + '</ul>';
    else if (s.type === 'tags') body = '<div class="d-flex flex-wrap gap-2">' + s.items.map(t => '<span class="tagchip">' + esc(t) + '</span>').join('') + '</div>';
    else body = '<ul class="checks">' + s.items.map(t => '<li><i class="bi bi-check-circle-fill"></i> ' + esc(t) + '</li>').join('') + '</ul>';
    return '<div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-' + icon + '"></i> ' + esc(s.title) + '</h4>' + body + '</div>';
}

function seatMap() {
    let h = '<div class="stage">' + (ev.category === 'Cinema' ? 'SCREEN' : 'STAGE') + '</div><div class="seatmap">';
    for (let r = 0; r < ev.seatRows; r++) {
        h += '<div class="seat-row"><span class="rl">' + rowName(r) + '</span>';
        for (let c = 1; c <= ev.seatsPerRow; c++) {
            const l = rowName(r) + c, t = taken.get(l);
            const cls = (t ? (t.mine ? 'mine' : 'taken') : sel.has(l) ? 'sel' : '') + (r < ev.vipRows ? ' vip' : '');
            h += '<button type="button" class="seat ' + cls + '" data-s="' + l + '" title="' + l + ' · ' + money(seatPrice(ev, l)) + '"' + (t ? ' disabled' : '') + '>' + c + '</button>';
            if (c === Math.floor(ev.seatsPerRow / 2)) h += '<i class="aisle"></i>';
        }
        h += '<span class="rl">' + rowName(r) + '</span></div>';
    }
    return h + '</div><div class="legend"><span><i class="seat"></i> Available</span>' + (ev.vipRows ? '<span><i class="seat vip"></i> VIP ' + money(ev.vipPrice) + '</span>' : '') + '<span><i class="seat sel"></i> Selected</span><span><i class="seat taken"></i> Taken</span><span><i class="seat mine"></i> Yours</span></div>';
}

function summary() {
    const n = seated() ? sel.size : qty;
    $('#chosen').innerHTML = seated()
        ? (sortedSel().map(s => '<span class="sel-chip">' + s + '</span>').join('') || '<span class="text-secondary small">Pick your seats on the map</span>')
        : '<div class="input-group" style="max-width:150px"><button class="btn btn-outline-light" data-q="-1">−</button><span class="form-control text-center">' + qty + '</span><button class="btn btn-outline-light" data-q="1">+</button></div>';
    $('#total').textContent = n ? money(total()) : '—';
    $$('#actions button').forEach(b => b.disabled = n < 1);
}

function draw() {
    document.title = 'EventHub - ' + ev.title;
    let d = ev.details; if (typeof d === 'string') { try { d = JSON.parse(d); } catch { d = null; } }
    d = d || {};
    const left = ev.capacity - ev.registeredCount, free = ev.price === 0;
    $('#page').innerHTML = `
    <div class="ev-hero c-${esc(ev.category)}">${imgTag(ev)}<div class="ev-hero-in"><div class="container">
      <a href="index.html#events" class="text-white-50 small"><i class="bi bi-arrow-left"></i> All events</a>
      <div class="mt-2"><span class="badge bg-primary">${ICON[ev.category] || ''} ${esc(ev.category)}</span></div>
      <h1 class="display-5 mt-2">${esc(ev.title)}</h1>
      <p class="lead mb-3">${esc(d.tagline || '')}</p>
      <div class="d-flex flex-wrap gap-2">
        <span class="meta-chip"><i class="bi bi-calendar-event"></i> ${fmt(ev.startTime)}</span>
        <span class="meta-chip"><i class="bi bi-geo-alt"></i> ${esc(ev.location)}</span>
        ${ev.organizer ? '<span class="meta-chip"><i class="bi bi-person-badge"></i> ' + esc(ev.organizer) + '</span>' : ''}
        <span class="meta-chip"><i class="bi bi-ticket-perforated"></i> ${free ? 'Free entry' : 'From ' + money(ev.price)}</span>
      </div></div></div></div>
    <div class="container py-5"><div class="row g-4">
     <div class="col-lg-8">
      <div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-info-circle"></i> About this event</h4><p>${esc(ev.description)}</p>
       ${d.info ? '<div class="row g-3 mt-1">' + d.info.map(i => '<div class="col-sm-6"><small class="text-secondary">' + esc(i[0]) + '</small><div class="fw-semibold">' + esc(i[1]) + '</div></div>').join('') + '</div>' : ''}</div>
      ${(d.sections || []).map(sectionHtml).join('')}
      ${seated() ? '<div class="glass p-4 mb-4" id="seats"><h4 class="mb-3"><i class="bi bi-grid-3x3-gap"></i> Choose your seats</h4>' + seatMap() + '</div>' : ''}
     </div>
     <div class="col-lg-4"><div class="glass p-4 sticky-panel">
      <h4 class="mb-1">${seated() ? 'Your seats' : 'Tickets'}</h4>
      <p class="small text-secondary">${left > 0 ? left + ' of ' + ev.capacity + ' ' + (seated() ? 'seats' : 'tickets') + ' left' : 'Sold out'}${seated() && ev.vipRows ? ' · VIP rows ' + rowName(0) + (ev.vipRows > 1 ? '–' + rowName(ev.vipRows - 1) : '') : ''}</p>
      <div class="d-flex justify-content-between small mb-2"><span>Standard</span><b>${money(ev.price)}</b></div>
      ${seated() && ev.vipRows ? '<div class="d-flex justify-content-between small mb-2"><span>VIP</span><b>${money(ev.vipPrice)}</b></div>'.replace('${money(ev.vipPrice)}', money(ev.vipPrice)) : ''}
      <hr><div id="chosen" class="mb-3"></div>
      <div class="d-flex justify-content-between fs-5 mb-3"><span>Total</span><b id="total">—</b></div>
      <div id="actions" class="d-grid gap-2">
       ${free ? '<button class="btn btn-primary" data-act="BUY">Reserve free ' + (seated() ? 'seat(s)' : 'ticket(s)') + '</button>'
             : '<button class="btn btn-primary" data-act="CHECKOUT">Buy now</button><button class="btn btn-outline-light" data-act="RESERVE">Reserve, pay within 24h</button>'}
      </div>
      ${left <= 0 ? '<p class="text-warning small mt-3 mb-0">This event is sold out.</p>' : ''}
     </div></div>
    </div></div>`;
    summary();
    if (left <= 0) $$('#actions button').forEach(b => b.disabled = true);
}

async function load() {
    try {
        ev = await api('/events/' + id);
        taken = new Map((await api('/events/' + id + '/seats')).map(s => [s.seat, s]));
        draw();
    } catch (x) { $('#page').innerHTML = '<p class="text-center p-5 mb-0">' + esc(x.message || 'Event not found') + '</p>'; }
}

async function book(action, method) {
    try {
        const body = { action, paymentMethod: method || null };
        if (seated()) body.seats = [...sel]; else body.quantity = qty;
        await api('/events/' + id + '/tickets', 'POST', body);
        toast(action === 'RESERVE' ? 'Seats reserved! Pay within 24 hours in My Profile.' : 'Booking confirmed! See My Profile for your tickets.');
        sel.clear(); qty = 1; bootstrap.Modal.getOrCreateInstance('#payModal').hide(); await load();
    } catch (x) {
        toast(x.message || 'Booking failed', 'danger');
        if (x.status === 409) { sel.clear(); bootstrap.Modal.getOrCreateInstance('#payModal').hide(); await load(); }
    }
}

$('#page').onclick = e => {
    const s = e.target.closest('.seat');
    if (s && s.dataset.s && !s.disabled) {
        const l = s.dataset.s;
        if (sel.has(l)) sel.delete(l); else if (sel.size >= 8) return toast('Maximum 8 seats per booking', 'warning'); else sel.add(l);
        s.classList.toggle('sel', sel.has(l)); return summary();
    }
    const q = e.target.closest('[data-q]');
    if (q) { qty = Math.min(8, Math.max(1, qty + +q.dataset.q)); return summary(); }
    const b = e.target.closest('#actions button');
    if (!b) return;
    if (!state.user) return location.href = 'login.html?next=' + encodeURIComponent('event.html?id=' + id);
    if (b.dataset.act !== 'CHECKOUT') return book(b.dataset.act, 'FREE');
    const n = seated() ? sel.size : qty;
    $('#payBody').innerHTML = '<div class="d-flex justify-content-between"><span>' + esc(ev.title) + '</span><span>' + n + ' × ' + (seated() ? sortedSel().join(', ') : 'ticket') + '</span></div>' +
        '<div class="d-flex justify-content-between fs-5 mt-2"><span>Total</span><b>' + money(total()) + '</b></div>';
    bootstrap.Modal.getOrCreateInstance('#payModal').show();
};
$('#payConfirm').onclick = () => book('BUY', document.querySelector('input[name=pm]:checked').value);
load();
</script>
</body>
</html>
