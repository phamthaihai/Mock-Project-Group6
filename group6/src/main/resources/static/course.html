<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/learn.css" rel="stylesheet">
<title>LearnHub - Course</title>
<style>
    .chk {
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font-size: 1.1rem;
    }

    .ltype {
        padding: 0.1rem 0.6rem;
        border-radius: 50rem;
        background: rgba(255, 255, 255, 0.08);
        font-size: 0.7rem;
    }

    .player {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        background: linear-gradient(135deg, #1a1040, #2a3358);
        color: #cbd5ff;
    }

    .player i {
        font-size: 3.5rem;
        color: var(--brand2);
    }

    .review {
        padding: 1rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .task {
        padding: 1rem;
        border-radius: 12px;
        background: rgba(109, 93, 252, 0.15);
        border: 1px solid rgba(109, 93, 252, 0.4);
    }
</style>
</head>
<body>
<main class="flex-grow-1" id="page"><div class="text-center p-5"><div class="spinner-border"></div></div></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const admin = state.user?.role === 'ADMIN';
let c, enrolled = false, done = new Set(), quizzes = {};
const total = () => lessonCount(c) + quizCount(c);
const doneCount = () => done.size + Object.values(quizzes).filter(q => q.passed).length;
const sectionDone = si => (dets(c).curriculum[si].lessons || []).every((_, j) => done.has((si + 1) + '.' + (j + 1)));
const canOpen = () => enrolled || admin;
function pct() { return total() ? Math.round(doneCount() / total() * 100) : 0; }
function updateProg() { const b = $('#pbar'); if (b) { b.style.width = pct() + '%'; $('#ptxt').textContent = doneCount() + ' of ' + total() + ' items (lessons + quizzes) · ' + pct() + '%'; } }

function lesson(i, j, l) {
    const k = (i + 1) + '.' + (j + 1), d = done.has(k);
    const ic = enrolled ? '<button class="chk" data-chk="' + k + '" title="Mark complete"><i class="bi ' + (d ? 'bi-check-circle-fill' : 'bi-circle') + '"></i></button>' : '<i class="bi ' + (admin ? 'bi-eye' : 'bi-lock') + '"></i>';
    return '<li class="lesson' + (d ? ' done' : '') + (canOpen() ? ' open' : '') + '" data-k="' + k + '">' + ic + '<span>' + esc(l.title) + '</span>' + (l.type ? '<small class="ltype">' + esc(l.type) + '</small>' : '') + '<small>' + l.minutes + ' min</small></li>';
}
function quizRow(i, q) {
    const st = quizzes[q.quizId], ok = !!st?.passed, open = admin || (enrolled && sectionDone(i)), locked = !open;
    const icon = ok ? 'bi-patch-check-fill' : locked ? 'bi-lock-fill' : 'bi-patch-question-fill';
    return '<li class="lesson quiz-row' + (ok ? ' done' : '') + (locked ? ' locked' : ' open') + '" data-quiz="' + q.quizId + '" data-locked="' + (locked ? (enrolled ? 'lessons' : 'enroll') : '') + '"><i class="bi ' + icon + '"></i><span>' + esc(q.title) + '</span>' +
        '<small class="ltype">Quiz</small><small>' + q.questionCount + ' Q' + (st ? ' · best ' + st.best + '%' : ' · pass ' + q.passPercent + '%') + '</small></li>';
}

const NAMES = ['Minh Anh Pham', 'Daniel Kim', 'Hoa Nguyen', 'Sofia Alvarez', 'Tuan Le', 'Aisha Khan', 'Lucas Meyer', 'Thao Vo', 'Priyank Shah', 'Linh Dang'];
const TPL = [
    { r: 5, t: c => 'Great course! ' + c.instructor + ' explains everything step by step and the examples are easy to follow.' },
    { r: 5, t: c => 'Exactly what I needed for my job. I applied the lessons to a real project within a week.' },
    { r: 5, t: c => 'The curriculum is well structured and the practice tasks really help the ideas stick.' },
    { r: 4, t: c => 'Good value for the price. I would love a few more advanced exercises, but overall very satisfied.' },
    { r: 5, t: c => 'I started as a complete beginner and finished with real confidence. Highly recommended!' },
    { r: 4, t: c => 'Clear, practical and well paced. The slides and resources are a nice bonus.' },
    { r: 3, t: c => 'Solid content. A few sections moved quickly for me, but replaying the lessons helped.' },
    { r: 5, t: c => 'Best online course I have taken this year. The instructor really knows the subject.' },
    { r: 5, t: c => 'The ' + c.title + ' lessons are organised logically, so I always knew what to learn next.' },
    { r: 4, t: c => 'Friendly teaching style and useful practice tasks. I finished the whole course in two weeks.' }
];
// Sample reviews, used only when the backend does not send details.reviews: [{name, rating, comment, date}]
function sampleReviews(c) {
    let s = (c.courseId % 100000) + 1; const rnd = () => (s = s * 16807 % 2147483647) / 2147483647;
    const shuffle = a => a.map(v => [rnd(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
    const names = shuffle(NAMES), tpl = shuffle(TPL).slice(0, 6);
    return tpl.map((t, i) => ({ name: names[i], rating: t.r, daysAgo: 3 + Math.floor(rnd() * 120), comment: t.t(c) }));
}
function reviewsHtml(c, d) {
    const rv = d.reviews && d.reviews.length ? d.reviews : sampleReviews(c);
    return '<div class="glass p-4 mb-4"><div class="d-flex flex-wrap justify-content-between align-items-center mb-3"><h4 class="mb-0"><i class="bi bi-chat-quote"></i> Student reviews</h4>' +
        '<div><span class="text-warning fs-5">★ ' + c.rating + '</span> <span class="text-secondary small">course rating · ' + rv.length + ' reviews</span></div></div><div class="row g-3">' +
        rv.map(r => { const when = r.date ? new Date(r.date) : new Date(Date.now() - (r.daysAgo || 0) * 864e5);
            return '<div class="col-md-6"><div class="review h-100"><div class="person"><span class="avatar">' + esc(r.name.split(' ').map(w => w[0]).slice(0, 2).join('')) + '</span><div><div class="fw-semibold">' + esc(r.name) + '</div>' +
                '<div class="text-warning small">' + '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) + ' <span class="text-secondary">· ' + when.toLocaleDateString() + '</span></div></div></div>' +
                '<p class="mt-3 mb-0">' + esc(r.comment) + '</p></div></div>'; }).join('') + '</div></div>';
}

function draw() {
    document.title = 'LearnHub - ' + c.title;
    const d = dets(c), curr = d.curriculum || [], free = c.price === 0;
        $('#page').innerHTML = `
    <div class="ev-hero ${catClass(c.category)}">${imgTag(c)}<div class="ev-hero-in"><div class="container">
      <a href="index.html#courses" class="text-white-50 small"><i class="bi bi-arrow-left"></i> All courses</a>
      <div class="mt-2"><span class="badge bg-primary">${ICON[c.category] || ''} ${esc(c.category)}</span> <span class="badge bg-secondary">${esc(c.level)}</span></div>
      <h1 class="display-5 mt-2">${esc(c.title)}</h1>
      <p class="lead mb-3">${esc(d.tagline || '')}</p>
      <div class="d-flex flex-wrap gap-2">
        <span class="meta-chip"><i class="bi bi-person-video3"></i> ${esc(c.instructor)}</span>
        <span class="meta-chip text-warning">★ ${c.rating} <span class="text-white-50">(${c.enrolledCount} students)</span></span>
        <span class="meta-chip"><i class="bi bi-clock"></i> ${c.durationHours} hours</span>
        <span class="meta-chip"><i class="bi bi-translate"></i> ${esc(c.language)}</span>
      </div></div></div></div>
    <div class="container py-5"><div class="row g-4">
     <div class="col-lg-8">
      <div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-info-circle"></i> About this course</h4><p class="mb-0">${esc(c.description)}</p></div>
      ${d.learn ? '<div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-stars"></i> What you will learn</h4><ul class="checks mb-0">' + d.learn.map(t => '<li><i class="bi bi-check-circle-fill"></i> ' + esc(t) + '</li>').join('') + '</ul></div>' : ''}
      <div class="glass p-4 mb-4" id="content"><h4 class="mb-1"><i class="bi bi-collection-play"></i> Course content</h4>
       <p class="small text-secondary mb-3">${curr.length} sections · ${lessonCount(c)} lessons · ${quizCount(c)} quizzes · ${c.durationHours} hours${canOpen() ? ' · Click a lesson to open the learning page. Quizzes unlock after the section lessons.' : ' · Enroll to unlock lessons'}</p>
       <div class="accordion" id="acc">${curr.map((s, i) => '<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button' + (i ? ' collapsed' : '') + '" type="button" data-bs-toggle="collapse" data-bs-target="#sec' + i + '">' + esc(s.title) + '<small class="ms-2 text-secondary">' + s.lessons.length + ' lessons' + ((s.quizzes || []).length ? ' · ' + s.quizzes.length + ' quiz' + (s.quizzes.length > 1 ? 'zes' : '') : '') + '</small></button></h2><div id="sec' + i + '" class="accordion-collapse collapse' + (i ? '' : ' show') + '"><div class="accordion-body p-0"><ul class="lessons">' + s.lessons.map((l, j) => lesson(i, j, l)).join('') + (s.quizzes || []).map(q => quizRow(i, q)).join('') + '</ul></div></div></div>').join('')}</div></div>
      ${d.requirements ? '<div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-list-check"></i> Requirements</h4><ul class="checks mb-0">' + d.requirements.map(t => '<li><i class="bi bi-dot"></i> ' + esc(t) + '</li>').join('') + '</ul></div>' : ''}
      ${d.skills ? '<div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-lightning-charge"></i> Skills you will gain</h4><div class="d-flex flex-wrap gap-2">' + d.skills.map(t => '<span class="tagchip">' + esc(t) + '</span>').join('') + '</div></div>' : ''}
      <div class="glass p-4 mb-4"><h4 class="mb-3"><i class="bi bi-person-badge"></i> Your instructor</h4>
       <div class="person"><span class="avatar">${esc(c.instructor.split(' ').map(w => w[0]).slice(0, 2).join(''))}</span><div><div class="fw-semibold">${esc(c.instructor)}</div><small class="text-secondary">${esc(c.category)} instructor</small></div></div>
       <p class="mt-3 mb-0">${esc(d.instructorBio || '')}</p></div>
      ${reviewsHtml(c, d)}
     </div>
     <div class="col-lg-4"><div class="glass p-4 sticky-panel">
      ${enrolled ? `<div class="badge bg-success mb-3">✓ You are enrolled</div><h5>Your progress</h5>
        <div class="progress mb-2" style="height:8px"><div id="pbar" class="progress-bar" style="width:${pct()}%"></div></div><small id="ptxt" class="text-secondary">${doneCount()} of ${total()} items (lessons + quizzes) · ${pct()}%</small>
        ${pct() === 100 && total() ? '<a href="congrats.html?id=' + id + '" class="btn btn-success w-100 mt-3"><i class="bi bi-award-fill"></i> View certificate</a><a href="learn.html?id=' + id + '" class="btn btn-outline-light w-100 mt-2">Review lessons</a>' : '<a href="learn.html?id=' + id + '" class="btn btn-primary w-100 mt-3"><i class="bi bi-play-fill"></i> ' + (doneCount() ? 'Continue learning' : 'Start learning') + '</a><p class="small text-secondary mt-3 mb-0">Finish each section\'s lessons to unlock its quiz. Pass every quiz to earn your certificate.</p>'}${admin ? '<a href="admin.html" class="btn btn-outline-light w-100 mt-3">Manage courses</a>' : ''}`
      : admin ? `<div class="badge bg-info text-dark mb-3"><i class="bi bi-shield-check"></i> Admin access</div><h5>Enroll without payment</h5>
        <p class="small text-secondary">Admins can open every lesson and enroll in any course for free.</p>
        <button class="btn btn-primary w-100" id="adminEnroll">Enroll (no payment)</button><a href="learn.html?id=${id}" class="btn btn-outline-light w-100 mt-2">Preview learning page</a><a href="admin.html" class="btn btn-outline-light w-100 mt-2">Manage courses</a>`
      : `<div class="price-big">${money(c.price)}</div>
        <button class="btn btn-primary w-100 mt-3" id="buy">${free ? 'Enroll for free' : 'Buy now'}</button>
        <ul class="checks small mt-4 mb-0"><li><i class="bi bi-play-circle-fill"></i> ${c.durationHours} hours of video lessons</li><li><i class="bi bi-collection-play-fill"></i> ${lessonCount(c)} lessons in ${curr.length} sections</li><li><i class="bi bi-patch-question-fill"></i> ${quizCount(c)} quizzes to test yourself</li><li><i class="bi bi-infinity"></i> Lifetime access</li><li><i class="bi bi-award-fill"></i> Certificate of completion</li></ul>`}
     </div></div>
    </div></div>`;
}

async function load() {
    try {
        c = await api('/courses/' + id);
        const p = await api('/courses/' + id + '/progress'); enrolled = p.enrolled; done = new Set(p.completed); quizzes = p.quizzes || {};
        draw();
    } catch (x) { $('#page').innerHTML = '<p class="text-center p-5 mb-0">' + esc(x.message || 'Course not found') + '</p>'; }
}

async function enroll(method) {
    try {
        await api('/courses/' + id + '/enroll', 'POST', { paymentMethod: method || null });
        toast('You are enrolled! Happy learning.'); await load();
    } catch (x) { toast(x.message || 'Enrollment failed', 'danger'); }
}

async function setDone(k, now) {
    try {
        const res = await api('/courses/' + id + '/progress', 'PUT', { lesson: k, done: now });
        now ? done.add(k) : done.delete(k);
        if (now && res?.courseCompleted) { toast('Course completed! 🎉'); return setTimeout(() => location.href = 'congrats.html?id=' + id, 1400); }
        await load(); // quiz rows may unlock or lock again
    } catch (x) { toast(x.message || 'Failed', 'danger'); }
}

$('#page').onclick = e => {
    const chk = e.target.closest('[data-chk]');
    if (chk) return setDone(chk.dataset.chk, !done.has(chk.dataset.chk));
    const qr = e.target.closest('[data-quiz]');
    if (qr) {
        if (qr.dataset.locked === 'enroll') return toast('Enroll in this course to unlock its quizzes', 'info');
        if (qr.dataset.locked === 'lessons') return toast('Finish all lessons in this section to unlock the quiz', 'info');
        return location.href = 'quiz.html?id=' + id + '&quiz=' + qr.dataset.quiz;
    }
    const li = e.target.closest('.lesson');
    if (li) return canOpen() ? location.href = 'learn.html?id=' + id + '&k=' + li.dataset.k : toast('Enroll in this course to unlock its lessons', 'info');
    if (e.target.closest('#adminEnroll')) return enroll(null);
    if (!e.target.closest('#buy')) return;
    if (!state.user) return location.href = 'login.html?next=' + encodeURIComponent('course.html?id=' + id);
    if (c.price === 0) return enroll(null);
    location.href = 'checkout.html?id=' + id;
};
load();
</script>
</body>
</html>
