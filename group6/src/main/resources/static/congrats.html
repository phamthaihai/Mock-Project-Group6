<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>LearnHub - Congratulations</title>
</head>
<body>
<main class="flex-grow-1 container py-5" id="page"><div class="text-center p-5"><div class="spinner-border"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
if (guard()) (async () => {
  const id = +new URLSearchParams(location.search).get('id');
  try {
    const [mine, courses] = await Promise.all([api('/enrollments/me'), api('/courses')]);
    const e = mine.find(x => x.courseId === id);
    if (!e || !isDone(e)) { flash('Finish every lesson and pass every quiz to earn your certificate', 'info'); return location.href = id ? 'course.html?id=' + id : 'profile.html'; }
    const sug = suggestNext(courses, mine, 3);
    $('#page').innerHTML = `
      <div class="text-center mb-5">
        <div class="trophy"><i class="bi bi-trophy-fill"></i></div>
        <h1 class="display-5 fw-bold">Congratulations, ${esc(e.studentName.split(' ')[0])}! 🎉</h1>
        <p class="lead text-secondary mb-0">You completed <b class="text-reset">${esc(e.title)}</b> (${e.completedLessons}/${e.totalLessons} lessons, ${e.passedQuizzes}/${e.totalQuizzes} quizzes passed). Your certificate has been added to <b class="text-reset">My Learning</b>.</p>
      </div>
      <div class="mx-auto mb-4" style="max-width:820px">${certificateHtml(e)}</div>
      <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">
        <button class="btn btn-primary" id="print"><i class="bi bi-printer"></i> Download / Print certificate</button>
        <a class="btn btn-outline-light" href="profile.html#learning"><i class="bi bi-journal-bookmark"></i> Go to My Learning</a>
        <a class="btn btn-outline-light" href="course.html?id=${e.courseId}"><i class="bi bi-arrow-left"></i> Back to course</a>
      </div>
      ${sug.length ? `<div class="section-title"><small>Keep going</small><h2>Your next course</h2></div><div class="row g-4">${sug.map(x => sugCard(x.c, x.why)).join('')}</div>` : '<p class="text-center text-secondary">You have enrolled in every course on LearnHub. Amazing!</p>'}`;
    $('#print').onclick = () => printCertificate(e);
    confetti();
  } catch (x) { $('#page').innerHTML = '<p class="text-center p-5 mb-0">' + esc(x.message || 'Something went wrong') + '</p>'; }
})();
</script>
</body>
</html>
