<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>LearnHub - Sign up</title></head>
<body>
<main class="flex-grow-1 d-flex align-items-center py-5"><div class="container" style="max-width:440px">
 <form id="f" class="glass p-4">
  <h2 class="mb-3">Sign up</h2>
  <input name="fullName" class="form-control mb-2" placeholder="Full name" maxlength="100" required>
  <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
  <input name="password" type="password" class="form-control mb-2" placeholder="Password (min 6)" minlength="6" required>
  <input name="confirm" type="password" class="form-control mb-3" placeholder="Confirm password" required>
  <button class="btn btn-primary w-100">Sign up</button>
  <p class="small mt-3 mb-0">Have an account? <a href="login.html">Login</a></p>
 </form></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/seed-content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
if (state.user) location.href = 'index.html';
$('#f').onsubmit = async e => {
  e.preventDefault();
  const { confirm, ...d } = formData(e.target);
  if (confirm !== d.password) return toast('Passwords do not match', 'danger');
  try { await api('/auth/register', 'POST', d); flash('You registered successfully!'); location.href = 'login.html'; }
  catch (x) { toast(x.message || 'Sign up failed', 'danger'); }
};
</script></body></html>
