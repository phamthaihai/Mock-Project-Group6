<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
    <title>SkillTrail - Courses</title>
</head>

<body>
    <main class="flex-grow-1">
        <section class="page-hero" style="--hero-img:url('https://picsum.photos/seed/learnhub-code/1800/700')">
            <i class="ph-shape a"></i><i class="ph-shape b"></i><i class="ph-shape c"></i><i class="ph-shape d"></i>
            <div class="container position-relative" style="z-index:2">
                <div class="crumbs mb-2" data-reveal><a href="index.html">Home</a> <i class="bi bi-chevron-right mx-1"></i> Courses</div>
                <span class="eyebrow" data-reveal>Catalog</span>
                <h1 data-reveal style="--delay:80ms">Explore Our Courses</h1>
                <p data-reveal style="--delay:160ms">Search the whole catalog, filter by level, price and rating, and start learning today.</p>
            </div>
            <svg class="wave-bottom" viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0 30 C240 70 480 -10 720 28 C960 66 1200 0 1440 34 L1440 60 L0 60 Z"/></svg>
        </section>

        <section id="courses" class="container py-5">
            <div id="chips" class="d-flex flex-wrap justify-content-center gap-2 mb-4"></div>
            <div class="row g-2 mb-4">
                <div class="col-lg-4"><input id="q" class="form-control"
                        placeholder="Search by course, topic or instructor..."></div>
                <div class="col-6 col-lg-2"><select id="lv" class="form-select">
                        <option value="">All levels</option>
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select></div>
                <div class="col-6 col-lg-2"><select id="pr" class="form-select">
                        <option value="">Any price</option>
                        <option value="free">Free</option>
                        <option value="paid">Paid</option>
                    </select></div>
                <div class="col-6 col-lg-2"><select id="rt" class="form-select">
                        <option value="0">Any rating</option>
                        <option value="4">4★ and up</option>
                        <option value="4.5">4.5★ and up</option>
                    </select></div>
                <div class="col-6 col-lg-2"><select id="sort" class="form-select">
                        <option value="pop">Most popular</option>
                        <option value="rate">Top rated</option>
                        <option value="low">Price: low to high</option>
                    </select></div>
            </div>
            <div id="grid" class="row g-4"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        let courses = [], mine = new Set(), cat = 0;
        $('#chips').onclick = e => {
            const b = e.target.closest('.chip'); if (!b) return;
            cat = +b.dataset.c; $$('.chip').forEach(x => x.classList.toggle('active', x === b)); render();
        };
        function render() {
            const q = $('#q').value.toLowerCase(), lv = $('#lv').value, pr = $('#pr').value, rt = +$('#rt').value, s = $('#sort').value;
            const l = courses.filter(c => (!cat || c.categoryId === cat) && (!lv || c.level === lv) && (!pr || (pr === 'free') === (c.price === 0)) && c.rating >= rt &&
                (c.title + ' ' + c.instructor.fullName + ' ' + c.description).toLowerCase().includes(q));
            l.sort(s === 'rate' ? (a, b) => b.rating - a.rating : s === 'low' ? (a, b) => a.price - b.price : (a, b) => b.enrolledCount - a.enrolledCount);
            $('#grid').innerHTML = l.map(c => card(c, mine.has(c.courseId))).join('') || '<p class="text-center text-secondary py-5">No courses found.</p>';
        }
        ['q', 'lv', 'pr', 'rt', 'sort'].forEach(i => $('#' + i).addEventListener('input', render));
        (async () => {
            try {
                const [cats, cs] = await Promise.all([api('/categories'), api('/courses')]); courses = cs;
                $('#chips').innerHTML = '<button class="chip active" data-c="0">✨ All</button>' + cats.map(k => '<button class="chip" data-c="' + k.categoryId + '">' + (ICON[k.name] || '📚') + ' ' + esc(k.name) + '</button>').join('');
                const qc = +new URLSearchParams(location.search).get('cat'); // from the category tiles on the home page
                if (qc && cats.some(k => k.categoryId === qc)) { cat = qc; $$('.chip').forEach(x => x.classList.toggle('active', +x.dataset.c === qc)); }
                if (state.user) mine = new Set((await api('/enrollments/me')).map(x => x.courseId));
            } catch (x) { toast(x.message || 'Could not load courses', 'danger'); }
            render();
        })();
    </script>
</body>

</html>
