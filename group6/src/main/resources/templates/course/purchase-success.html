<!DOCTYPE html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script th:src="@{/js/theme.js}"></script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"><link th:href="@{/css/theme.css}" rel="stylesheet"><link th:href="@{/css/courses.css}" rel="stylesheet"><title>Purchase Complete · SkillTrail</title></head><body class="d-flex flex-column min-vh-100"><div class="bg"><i></i><i></i><i></i><i></i></div><div th:replace="~{course/fragments :: nav}"></div><main class="container py-5 flex-grow-1"><section class="glass success-panel text-center p-5"><div class="success-icon"><i class="bi bi-check-lg"></i></div><small class="text-success fw-bold">MOCK PAYMENT APPROVED</small><h1 class="mt-2">You're ready to learn!</h1><p class="text-secondary">Your demo purchase was successful. The selected courses have been added to My Learning.</p><div class="order-reference">Order <strong th:text="${order.orderNumber}">ST-000</strong></div><div class="d-flex justify-content-between border-top border-bottom py-3 my-4"><span class="text-secondary">Payment method</span><strong th:text="${order.paymentMethod}">DEMO</strong></div><div class="d-flex justify-content-between mb-4"><span class="text-secondary">Total (simulated)</span><strong class="fs-4" th:text="${'₫' + #numbers.formatDecimal(order.total,1,0)}">₫0</strong></div><div class="text-start mb-4"><h6>Purchased courses</h6><div class="checkout-item" th:each="item:${order.items}"><span th:text="${item.title}">Course</span><strong th:text="${'₫' + #numbers.formatDecimal(item.price,1,0)}">₫0</strong></div></div><a th:href="@{/my-learning}" class="btn btn-primary btn-lg">Go to My Learning</a></section></main><div th:replace="~{course/fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
