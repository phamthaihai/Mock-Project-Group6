<!DOCTYPE html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script th:src="@{/js/theme.js}"></script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"><link th:href="@{/css/theme.css}" rel="stylesheet"><link th:href="@{/css/courses.css}" rel="stylesheet"><title th:text="${course.title} + ' · SkillTrail'">Course · SkillTrail</title></head><body class="d-flex flex-column min-vh-100"><div class="bg"><i></i><i></i><i></i><i></i></div><div th:replace="~{course/fragments :: nav}"></div><main class="container py-5 flex-grow-1"><div th:replace="~{course/fragments :: alerts}"></div><a th:href="@{/courses}" class="back-link"><i class="bi bi-arrow-left"></i> Browse courses</a>
<div class="row g-4 mt-2"><div class="col-lg-8"><span class="course-pill" th:text="${course.category}">Category</span><h1 class="mt-3" th:text="${course.title}">Course title</h1><p class="lead text-secondary" th:text="${course.description}">Description</p><div class="text-secondary mb-4"><i class="bi bi-person-circle"></i> Created by <strong th:text="${course.instructor}">Instructor</strong> · <span th:text="${course.level}">Beginner</span></div><section class="glass p-4"><h4>Course content</h4><div th:if="${#lists.isEmpty(course.sections)}" class="text-secondary">Course content will be added soon.</div><div class="section-outline" th:each="section:${course.sections}"><h6><i class="bi bi-collection"></i> <span th:text="${section.title}">Section</span></h6><div class="lesson-outline" th:each="lesson:${section.lessons}"><i class="bi bi-play-circle"></i><span th:text="${lesson.title}">Lesson</span><small class="ms-auto text-secondary" th:text="${lesson.minutes} + ' min'"></small></div></div></section></div><div class="col-lg-4"><aside class="glass p-3 course-buy-card"><img class="course-thumb rounded-3" th:src="${course.imageUrl != null and !#strings.isEmpty(course.imageUrl) ? course.imageUrl : 'https://picsum.photos/seed/skilltrail-detail/700/420'}" alt="Course thumbnail"><div class="p-2"><div class="display-6 fw-bold mb-3" th:text="${course.price != null and course.price.signum() == 0 ? 'Free' : '₫' + #numbers.formatDecimal(course.price,1,0)}">Free</div><a th:if="${enrolled}" class="btn btn-primary w-100 mb-2" th:href="@{/courses/{id}/learn(id=${course.courseId})}">Continue learning</a><form th:if="${!enrolled and !owner and course.price != null and course.price.signum() == 0}" th:action="@{/courses/{id}/enroll(id=${course.courseId})}" method="post"><button class="btn btn-primary w-100 mb-2">Join free course</button></form><form th:if="${!enrolled and !owner and course.price != null and course.price.signum() > 0}" th:action="@{/cart/{id}(id=${course.courseId})}" method="post"><button class="btn btn-primary w-100 mb-2"><i class="bi bi-cart-plus"></i> Add to cart</button></form><a th:if="${owner}" th:href="@{/my-courses/{id}/edit(id=${course.courseId})}" class="btn btn-outline-light w-100">Manage my course</a><div class="small text-secondary mt-3"><div class="mb-2"><i class="bi bi-infinity"></i> Learn at your own pace</div><div class="mb-2"><i class="bi bi-bar-chart"></i> Track your progress</div><div><i class="bi bi-phone"></i> Access anytime</div></div></div></aside></div></div></main><div th:replace="~{course/fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
