<!DOCTYPE html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script th:src="@{/js/theme.js}"></script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"><link th:href="@{/css/theme.css}" rel="stylesheet"><link th:href="@{/css/courses.css}" rel="stylesheet"><title>Cart · SkillTrail</title></head><body class="d-flex flex-column min-vh-100"><div class="bg"><i></i><i></i><i></i><i></i></div><div th:replace="~{course/fragments :: nav}"></div><main class="container py-5 flex-grow-1"><div th:replace="~{course/fragments :: alerts}"></div><div class="course-heading mb-4"><small>YOUR CART</small><h1>Shopping cart</h1><p class="text-secondary">Review your courses before mock checkout.</p></div><div class="row g-4" th:if="${!#lists.isEmpty(items)}"><div class="col-lg-8"><div class="glass p-3"><div class="cart-row" th:each="item:${items}"><img th:src="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl) ? item.imageUrl : 'https://picsum.photos/seed/cart-course/180/120'}" alt="Course"><div class="flex-grow-1"><h5 th:text="${item.title}">Course</h5><div class="small text-secondary" th:text="${item.category}">Category</div><strong th:text="${'₫' + #numbers.formatDecimal(item.price,1,0)}">₫0</strong></div><form method="post" th:action="@{/cart/{id}/remove(id=${item.courseId})}"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Remove</button></form></div></div></div><div class="col-lg-4"><aside class="glass p-4"><h5>Order summary</h5><div class="d-flex justify-content-between my-3"><span class="text-secondary">Subtotal</span><strong th:text="${'₫' + #numbers.formatDecimal(total,1,0)}">₫0</strong></div><div class="d-flex justify-content-between border-top pt-3"><strong>Total</strong><strong class="fs-4" th:text="${'₫' + #numbers.formatDecimal(total,1,0)}">₫0</strong></div><a th:href="@{/checkout}" class="btn btn-primary w-100 mt-4">Continue to checkout</a><a th:href="@{/courses}" class="btn btn-outline-light w-100 mt-2">Continue browsing</a><p class="small text-secondary mt-3 mb-0"><i class="bi bi-shield-check"></i> Demo checkout only. No real payment will be taken.</p></aside></div></div><div class="glass empty-state text-center p-5" th:if="${#lists.isEmpty(items)}"><i class="bi bi-cart3 fs-1"></i><h4 class="mt-3">Your cart is empty</h4><p class="text-secondary">Find a course you would like to learn.</p><a th:href="@{/courses}" class="btn btn-primary">Explore courses</a></div></main><div th:replace="~{course/fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
