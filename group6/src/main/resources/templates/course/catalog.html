<!DOCTYPE html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script th:src="@{/js/theme.js}"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"><link th:href="@{/css/theme.css}" rel="stylesheet"><link th:href="@{/css/courses.css}" rel="stylesheet"><title>Explore Courses · SkillTrail</title></head><body class="d-flex flex-column min-vh-100"><div class="bg"><i></i><i></i><i></i><i></i></div>
<div th:replace="~{course/fragments :: nav}"></div><main class="container py-5 flex-grow-1"><div th:replace="~{course/fragments :: alerts}"></div>
<div class="course-heading mb-4"><small>LEARN SOMETHING NEW</small><h1>Explore courses</h1><p class="text-secondary">Build practical skills with courses you can follow at your own pace.</p></div>
<form class="glass p-3 mb-4 row g-2" method="get" th:action="@{/courses}"><div class="col-md-7"><input class="form-control" name="q" th:value="${keyword}" placeholder="Search courses..."></div><div class="col-md-3"><select class="form-select" name="category"><option value="">All categories</option><option th:each="cat:${categories}" th:value="${cat.categoryId}" th:text="${cat.name}" th:selected="${selectedCategory != null and selectedCategory == cat.categoryId}"></option></select></div><div class="col-md-2 d-grid"><button class="btn btn-primary"><i class="bi bi-search"></i> Search</button></div></form>
<div class="row g-4" th:if="${!#lists.isEmpty(courses)}"><div class="col-md-6 col-xl-4" th:each="course:${courses}"><article class="course-card h-100"><img class="course-thumb" th:src="${course.imageUrl != null and !#strings.isEmpty(course.imageUrl) ? course.imageUrl : 'https://picsum.photos/seed/skilltrail-course/700/420'}" alt="Course thumbnail"><div class="p-3"><span class="course-pill" th:text="${course.category}">Programming</span><h5 class="mt-2 mb-1" th:text="${course.title}">Course title</h5><p class="text-secondary small mb-2" th:text="${course.description}">Description</p><div class="small text-secondary mb-3"><i class="bi bi-person"></i> <span th:text="${course.instructor}">Instructor</span> · <i class="bi bi-play-circle"></i> <span th:text="${course.lessonCount}">0</span> lessons</div><div class="d-flex justify-content-between align-items-center"><strong th:text="${course.price != null and course.price.signum() == 0 ? 'Free' : '₫' + #numbers.formatDecimal(course.price,1,0)}">Free</strong><a class="btn btn-sm btn-primary" th:href="@{/courses/{id}(id=${course.courseId})}">View course</a></div></div></article></div></div>
<div class="glass empty-state text-center p-5" th:if="${#lists.isEmpty(courses)}"><i class="bi bi-search fs-1"></i><h4 class="mt-3">No courses found</h4><p class="text-secondary">Try another search or category.</p><a th:href="@{/courses}" class="btn btn-outline-light">Clear filters</a></div></main><div th:replace="~{course/fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
