<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg sticky-top glass"><div class="container">
  <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-mortarboard-fill"></i> Skill<span>Trail</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#courseNav"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="courseNav">
    <ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" th:href="@{/courses}">Explore courses</a></li><li class="nav-item"><a class="nav-link" th:href="@{/my-learning}">My Learning</a></li><li class="nav-item"><a class="nav-link" th:href="@{/my-courses}">My Created Courses</a></li><li class="nav-item" th:if="${currentUser != null and currentUser.role != null and (currentUser.role.name == 'ADMIN' or currentUser.role.name == 'MANAGER')}"><a class="nav-link" th:href="@{/admin}"><i class="bi bi-shield-lock"></i> Admin</a></li></ul>
    <a th:if="${currentUser != null}" class="user-chip text-reset text-decoration-none me-2" th:href="@{/user-profile}"><span>Hi, <span th:text="${currentUser.fullName}">User</span></span></a>
    <a th:if="${currentUser != null}" class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
    <a th:if="${currentUser == null}" class="btn btn-outline-light btn-sm me-2" th:href="@{/login}">Login</a>
    <a th:if="${currentUser == null}" class="btn btn-primary btn-sm" th:href="@{/register}">Sign up</a>
    <a th:if="${currentUser != null}" class="btn btn-primary btn-sm ms-2" th:href="@{/cart}"><i class="bi bi-cart3"></i> Cart</a>
    <button id="themeToggle" type="button" class="btn btn-sm theme-toggle ms-lg-2" onclick="toggleTheme()"></button>
  </div>
</div></nav>
<div th:fragment="alerts" class="container pt-3" th:if="${msg != null or err != null}">
  <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}"></div><div th:if="${err != null}" class="alert alert-danger" th:text="${err}"></div>
</div>
<footer th:fragment="footer" class="container py-4 mt-auto text-center text-secondary small">© SkillTrail · Learn at your own pace</footer>
</body></html>
