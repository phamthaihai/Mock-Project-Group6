<!DOCTYPE html><html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script th:src="@{/js/theme.js}"></script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"><link th:href="@{/css/theme.css}" rel="stylesheet"><link th:href="@{/css/courses.css}" rel="stylesheet"><title>My Learning · SkillTrail</title></head><body class="d-flex flex-column min-vh-100"><div class="bg"><i></i><i></i><i></i><i></i></div><div th:replace="~{course/fragments :: nav}"></div><main class="container py-5 flex-grow-1"><div th:replace="~{course/fragments :: alerts}"></div><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div class="course-heading"><small>YOUR LEARNING SPACE</small><h1>My Learning</h1><p class="text-secondary mb-0">Pick up where you left off and keep making progress.</p></div><a th:href="@{/courses}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Find a course</a></div>
<div class="row g-4" th:if="${!#lists.isEmpty(courses)}"><div class="col-md-6 col-xl-4" th:each="course:${courses}"><article class="course-card h-100"><img class="course-thumb" th:src="${course.imageUrl != null and !#strings.isEmpty(course.imageUrl) ? course.imageUrl : 'https://picsum.photos/seed/my-learning/700/420'}" alt="Course"><div class="p-3"><span class="course-pill" th:text="${course.category}">Category</span><h5 class="mt-2" th:text="${course.title}">Course</h5><p class="text-secondary small">By <span th:text="${course.instructor}">Instructor</span></p><div class="d-flex justify-content-between small mb-2"><span>Course progress</span><strong th:text="${course.percent} + '%'"></strong></div><div class="progress course-progress mb-3"><div class="progress-bar" role="progressbar" th:style="'width:' + ${course.percent} + '%'"></div></div><div class="small text-secondary mb-3"><span th:text="${course.completedLessons}">0</span> of <span th:text="${course.totalLessons}">0</span> lessons completed</div><a class="btn btn-primary w-100" th:href="@{/courses/{id}/learn(id=${course.courseId})}" th:text="${course.percent == 100 ? 'Review course' : 'Continue learning'}">Continue learning</a></div></article></div></div>
<div class="glass empty-state text-center p-5" th:if="${#lists.isEmpty(courses)}"><i class="bi bi-journal-bookmark fs-1"></i><h4 class="mt-3">Your learning journey starts here</h4><p class="text-secondary">Join a free course or purchase one to see it here.</p><a th:href="@{/courses}" class="btn btn-primary">Explore courses</a></div></main><div th:replace="~{course/fragments :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
