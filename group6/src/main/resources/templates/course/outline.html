
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="branch(node, courseId, editable)"
     class="outline-node"
     th:if="${node != null}">

    <details open>
        <summary class="d-flex align-items-center gap-2 flex-wrap">
            <i class="bi bi-folder2-open text-info"></i>

            <strong th:text="${node.title}">Module</strong>

            <span class="ms-auto small"
                  th:text="|${node.done}/${node.total} lessons · ${node.percent}%|">
                0%
            </span>
        </summary>

        <div class="progress course-progress my-2">
            <div class="progress-bar"
                 th:style="|width: ${node.percent}%|">
            </div>
        </div>

        <div class="outline-children">

            <div th:each="lesson : ${node.lessons}"
                 class="d-flex align-items-center gap-2 py-2">

                <i class="bi"
                   th:classappend="${lesson.done} ? 'bi-check-circle-fill text-success' : 'bi-play-circle text-info'">
                </i>

                <a class="flex-grow-1 text-decoration-none"
                   th:href="@{/courses/{c}/lessons/{l}(c=${courseId},l=${lesson.lessonId})}"
                   th:text="${lesson.title}">
                    Lesson
                </a>

                <small class="text-secondary"
                       th:text="|${lesson.minutes} min|">
                    5 min
                </small>

                <a th:if="${editable}"
                   class="btn btn-outline-light btn-sm"
                   th:href="@{/my-courses/{c}/lessons/{l}/edit(c=${courseId},l=${lesson.lessonId})}">
                    Edit
                </a>
            </div>

            <th:block th:each="child : ${node.children}">
                <div th:replace="~{course/outline :: branch(${child}, ${courseId}, ${editable})}"></div>
            </th:block>

        </div>
    </details>
</div>

</body>
</html>
