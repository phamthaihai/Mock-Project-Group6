<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/theme.js}"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/theme.css}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>SkillTrail - Profile</title>
</head>
<body class="d-flex flex-column min-vh-100">
  <div class="bg"><i></i><i></i><i></i><i></i></div>
  <nav class="navbar sticky-top glass"><div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-mortarboard-fill"></i> Skill<span>Trail</span></a>
    <div class="d-flex gap-2 align-items-center"><a class="btn btn-sm btn-outline-light" th:href="@{/}">Home</a><a class="btn btn-sm btn-outline-light" th:href="@{/logout}">Logout</a><button id="themeToggle" type="button" class="btn btn-sm theme-toggle ms-lg-2" onclick="toggleTheme()"></button></div>
  </div></nav>
  <main class="flex-grow-1 container py-5" style="max-width:900px">
    <div th:if="${success != null}" class="alert alert-success " th:text="${success}"></div>
    <div th:if="${error != null}" class="alert alert-danger " th:text="${error}"></div>
    <div th:if="${passwordError != null}" class="alert alert-danger " th:text="${passwordError}"></div>
    <div class="row g-4">
      <div class="col-md-6">
        <form th:action="@{/user-profile}" th:object="${profileDTO}" method="post" enctype="multipart/form-data" class="glass p-4 h-100" novalidate>
          <h4 class="mb-3">My Profile</h4>
          <div class="profile-avatar-wrap mb-3">
            <img id="avatarPreview" class="profile-avatar" alt="Your profile picture"
                 th:src="${currentUser != null and currentUser.avatar != null and !currentUser.avatar.isBlank()} ? @{${currentUser.avatar}} : @{/images/avatar-default.svg}">
            <div>
              <label for="avatarFile" class="btn btn-outline-light btn-sm"><i class="bi bi-camera"></i> Change picture</label>
              <input id="avatarFile" name="avatarFile" type="file" accept="image/*" hidden>
              <div class="small text-secondary mt-1">JPG or PNG</div>
            </div>
          </div>
          <label class="form-label small" for="fullName">Full name</label>
          <div class="mb-2">
            <input id="fullName" type="text" th:field="*{fullName}" class="form-control" maxlength="100" required>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
          </div>
          <label class="form-label small" for="email">Email</label>
          <div class="mb-2">
            <input id="email" type="email" th:field="*{email}" class="form-control" required>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
          </div>
          <label class="form-label small" for="phone">Phone</label>
          <div class="mb-3">
            <input id="phone" type="text" th:field="*{phone}" class="form-control" inputmode="numeric" maxlength="10" required>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
          </div>
          <button class="btn btn-primary">Save changes</button>
        </form>
      </div>
      <div class="col-md-6">
        <form th:action="@{/change-password}" th:object="${changePasswordDTO}" method="post" class="glass p-4 h-100" novalidate>
          <h4 class="mb-3">Change Password</h4>
          <div class="mb-2">
            <input type="password" th:field="*{oldPassword}" class="form-control" placeholder="Current password" autocomplete="current-password" required>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></span>
          </div>
          <div class="mb-2">
            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="New password (min 7)" autocomplete="new-password" required>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
          </div>
          <div class="mb-3">
            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Confirm new password" autocomplete="new-password" required>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('passwordMatch')}" th:errors="*{passwordMatch}"></span>
          </div>
          <button class="btn btn-primary">Update password</button>
        </form>
      </div>
    </div>
  </main>
  <footer class="glass text-center py-4 mt-auto">
    <div class="fs-5 fw-bold mb-2"><i class="bi bi-mortarboard-fill"></i> SkillTrail</div>
    <div class="links mb-2"><a th:href="@{/}" class="mx-2">Home</a></div>
    <div class="mb-2"><a href="#" class="mx-2"><i class="bi bi-facebook"></i></a><a href="#" class="mx-2"><i class="bi bi-instagram"></i></a>
    <a href="#" class="mx-2"><i class="bi bi-twitter-x"></i></a><a href="#" class="mx-2"><i class="bi bi-github"></i></a></div>
    <small class="text-secondary">&copy; 2026 SkillTrail. All rights reserved.</small>
  </footer>
  <script>paintThemeToggle();</script>
  <script>
    document.getElementById('avatarFile').onchange = function () {
      if (this.files && this.files[0]) document.getElementById('avatarPreview').src = URL.createObjectURL(this.files[0]);
    };
  </script>
</body>
</html>
