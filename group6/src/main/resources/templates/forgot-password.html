<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Quên mật khẩu | SkillTrail</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>
<main class="auth-layout">
    <aside class="auth-aside">
        <div class="brand">SkillTrail</div>
        <div class="aside-copy">
            <h1>Quay lại đúng nhịp học của bạn.</h1>
            <p>Nhập email để yêu cầu hướng dẫn đặt lại mật khẩu.</p>
        </div>
        <div class="aside-note">Your account stays yours.</div>
    </aside>
    <section class="auth-card">
        <h2>Khôi phục mật khẩu</h2>
        <p class="subtitle">Nếu email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
        <div th:if="${msg != null}" class="alert" th:text="${msg}"></div>
        <div th:if="${error != null}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post" novalidate>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="you@example.com" autocomplete="email" required/>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            <button type="submit" class="button">Gửi hướng dẫn</button>
        </form>
        <div class="form-links"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
    </section>
</main>
</body>
</html>
