<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/theme.js}"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link th:href="@{/css/theme.css}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>SkillTrail - Forgot password</title>
</head>
<body class="d-flex flex-column min-vh-100">
  <div class="bg"><i></i><i></i><i></i><i></i></div>
  <nav class="navbar sticky-top glass"><div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-mortarboard-fill"></i> Skill<span>Trail</span></a>
    <div class="d-flex gap-2 align-items-center"><a class="btn btn-outline-light btn-sm me-2" th:href="@{/login}">Login</a><a class="btn btn-primary btn-sm" th:href="@{/register}">Sign up</a><button id="themeToggle" type="button" class="btn btn-sm theme-toggle ms-lg-2" onclick="toggleTheme()"></button></div>
  </div></nav>
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width:440px">
      <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post" class="glass p-4" novalidate>
        <h2 class="mb-2">Forgot password</h2>
        <p class="small text-secondary">Enter your account email and we'll send you a link to reset your password.</p>
        <div th:if="${msg != null}" class="alert alert-success py-2" th:text="${msg}"></div>
        <div th:if="${error != null}" class="alert alert-danger py-2" th:text="${error}"></div>
        <div class="mb-3">
          <input id="email" type="email" th:field="*{email}" class="form-control" placeholder="Email" autocomplete="email" required>
          <span class="field-error d-block small text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <button class="btn btn-primary w-100">Send reset link</button>
        <p class="small mt-3 mb-0"><a th:href="@{/login}">Back to login</a></p>
      </form>
    </div>
  </main>
  <footer class="glass text-center py-4 mt-auto">
    <div class="fs-5 fw-bold mb-2"><i class="bi bi-mortarboard-fill"></i> SkillTrail</div>
    <div class="links mb-2"><a th:href="@{/}" class="mx-2">Home</a></div>
    <div class="mb-2"><a href="#" class="mx-2"><i class="bi bi-facebook"></i></a><a href="#" class="mx-2"><i class="bi bi-instagram"></i></a>
    <a href="#" class="mx-2"><i class="bi bi-twitter-x"></i></a><a href="#" class="mx-2"><i class="bi bi-github"></i></a></div>
    <small class="text-secondary">&copy; 2026 SkillTrail. All rights reserved.</small>
  </footer>
  <script>paintThemeToggle();</script>
</body>
</html>
