<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Đặt lại mật khẩu | SkillTrail</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>
<main class="auth-layout">
    <aside class="auth-aside">
        <div class="brand">SkillTrail</div>
        <div class="aside-copy">
            <h1>Thiết lập lại quyền truy cập.</h1>
            <p>Liên kết đặt lại mật khẩu có hiệu lực trong 10 phút.</p>
        </div>
        <div class="aside-note">Keep your account secure.</div>
    </aside>
    <section class="auth-card">
        <h2>Đặt lại mật khẩu</h2>
        <p class="subtitle">Tạo mật khẩu mới cho tài khoản của bạn.</p>
        <div th:if="${msg != null}" class="alert" th:text="${msg}"></div>
        <div th:if="${error != null}" class="alert alert-error" th:text="${error}"></div>

        <form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post" novalidate>
            <input type="hidden" th:field="*{token}"/>

            <label for="newPassword">Mật khẩu mới</label>
            <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required/>
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>

            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required/>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            <span class="field-error" th:if="${#fields.hasErrors('passwordMatch')}" th:errors="*{passwordMatch}"></span>

            <button type="submit" class="button">Cập nhật mật khẩu</button>
        </form>
        <div th:unless="${tokenValid}" class="form-links">
            <a class="button" th:href="@{/forgot-password}">Yêu cầu liên kết mới</a>
            <a th:href="@{/login}">Quay lại đăng nhập</a>
        </div>
    </section>
</main>
</body>
</html>
