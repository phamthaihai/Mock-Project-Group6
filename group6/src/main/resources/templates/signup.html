<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme.js"></script>
  <script>if (localStorage.getItem('user') || sessionStorage.getItem('user')) location.replace('index.html');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <title>SkillTrail - Sign up</title>
</head>

<body>
  <main class="auth flex-grow-1">
    <aside class="auth-aside" style="--aside-img:url('https://picsum.photos/seed/learnhub-code/1000/1200')">
      <i class="s s1"></i><i class="s s2"></i><i class="s s3"></i><i class="s s4"></i><i class="s s5"></i>
      <div class="position-relative" style="z-index:2">
        <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-4 text-white text-decoration-none fw-bold fs-4"><b class="brand-mark"><i class="bi bi-mortarboard-fill"></i></b> SkillTrail</a>
        <h2>Start learning today</h2>
        <p>Create a free account, verify your email and enroll in your first course in minutes.</p>
        <ul><li><i class="bi bi-check-lg"></i>Free to join, no card needed</li><li><i class="bi bi-check-lg"></i>Email-verified and secure</li><li><i class="bi bi-check-lg"></i>Certificates for every course you finish</li></ul>
      </div>
    </aside>
    <section class="auth-main"><div class="auth-card">
      <form id="f" class="auth-form" novalidate>
        <h2 class="mb-3">Sign up</h2>
        <div class="mb-2">
          <input name="fullName" class="form-control" placeholder="Full name" maxlength="100" autocomplete="name">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-2">
          <input name="email" type="email" class="form-control" placeholder="Email" maxlength="150" autocomplete="email">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-2">
          <input name="password" type="password" class="form-control" placeholder="Password" maxlength="64" autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <input name="confirm" type="password" class="form-control" placeholder="Confirm password" maxlength="64" autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>
        <button class="btn btn-primary w-100">Sign up</button>
        <div class="or-sep"><span>or</span></div>
        <div id="gsi" class="mb-1"></div>
        <p class="small mt-3 mb-0">Have an account? <a href="login.html">Login</a></p>
      </form>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    if (state.user) location.href = 'index.html';
    /* Validation: same rules as the Mock API (validateSignup in js/common.js). Fields are checked as you type and again on submit. */
    const F = $('#f'), FIELDS = ['fullName', 'email', 'password', 'confirm'];
    const check = d => { const v = validateSignup(d); if (!d.confirm) v.confirm = 'Please confirm your password'; else if (d.confirm !== d.password) v.confirm = 'Passwords do not match'; return v; };
    const mark = (name, msg) => { const i = F[name]; i.classList.toggle('is-invalid', !!msg); i.classList.toggle('is-valid', !msg && !!i.value); i.nextElementSibling.textContent = msg || ''; };
    const touched = new Set();
    const paint = all => { const v = check(formData(F)); FIELDS.forEach(k => { if (all || touched.has(k)) mark(k, v[k]); }); return v; };
    FIELDS.forEach(k => F[k].addEventListener('input', () => { touched.add(k); if (k === 'password' && F.confirm.value) touched.add('confirm'); paint(false); }));
    F.onsubmit = async e => {
      e.preventDefault();
      const v = paint(true), bad = FIELDS.find(k => v[k]);
      if (bad) { F[bad].focus(); return toast(v[bad], 'danger'); }
      const { confirm, ...d } = formData(F); d.fullName = d.fullName.trim(); d.email = d.email.trim();
      try {
        const r = await api('/auth/register', 'POST', d);
        if (r && r.verificationRequired) { // the account exists but stays unverified until the emailed code is entered
          if (r.demoCode) sessionStorage.setItem('demoCode', r.demoCode); else sessionStorage.removeItem('demoCode');
          flash(r.emailSent === false ? 'Account created, but the email could not be sent. Press "Resend code".' : 'Account created. We sent a 6-digit code to your email.');
          location.href = 'verify.html?email=' + encodeURIComponent(d.email);
        } else { flash('You registered successfully! Your account was saved.'); location.href = 'login.html'; }
      }
      catch (x) { if (x.status === 409) mark('email', x.message); toast(x.message || 'Sign up failed', 'danger'); }
    };
    initGoogleButton($('#gsi'));
  </script>
</body>

</html>
