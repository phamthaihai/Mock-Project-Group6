<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme.js"></script>
  <script>if (localStorage.getItem('user') || sessionStorage.getItem('user')) location.replace('index.html');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <title>SkillTrail - Verify email</title>
</head>

<body>
  <main class="auth flex-grow-1">
    <aside class="auth-aside" style="--aside-img:url('https://picsum.photos/seed/learnhub-team/1000/1200')">
      <i class="s s1"></i><i class="s s2"></i><i class="s s3"></i><i class="s s4"></i><i class="s s5"></i>
      <div class="position-relative" style="z-index:2">
        <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-4 text-white text-decoration-none fw-bold fs-4"><b class="brand-mark"><i class="bi bi-mortarboard-fill"></i></b> SkillTrail</a>
        <h2>Almost there</h2>
        <p>Enter the 6-digit code we emailed you to confirm your address and activate your account.</p>
        <ul><li><i class="bi bi-check-lg"></i>The code is valid for 10 minutes</li><li><i class="bi bi-check-lg"></i>You can request a new code any time</li><li><i class="bi bi-check-lg"></i>Your email is never shared</li></ul>
      </div>
    </aside>
    <section class="auth-main"><div class="auth-card">
      <form id="f" class="auth-form" novalidate>
        <h2 class="mb-2">Verify your email</h2>
        <p class="small text-secondary mb-2" id="hint"></p>
        <input name="code" class="form-control form-control-lg text-center mb-3" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="letter-spacing:.4em">
        <button class="btn btn-primary w-100">Verify</button>
        <button type="button" id="resend" class="btn btn-outline-secondary w-100 mt-2">Resend code</button>
        <p class="small mt-3 mb-0"><a href="signup.html">Use a different email</a> · <a href="login.html">Back to login</a></p>
      </form>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const q = new URLSearchParams(location.search), email = (q.get('email') || '').trim();
    if (!email) location.replace('signup.html');
    $('#hint').textContent = 'We sent a 6-digit code to ' + email + '. It expires in 10 minutes.';

    let wait = 0, timer;
    const tick = () => { $('#resend').disabled = wait > 0; $('#resend').textContent = wait > 0 ? 'Resend code (' + wait + 's)' : 'Resend code'; };
    const cooldown = s => { wait = s; tick(); clearInterval(timer); timer = setInterval(() => { if (--wait <= 0) clearInterval(timer); tick(); }, 1000); };
    async function resend(quiet) {
      try {
        await api('/auth/resend-code', 'POST', { email });
        cooldown(60);
        if (!quiet) toast('A new code has been sent');
      } catch (x) { toast(x.message || 'Could not resend the code', 'danger'); }
    }
    $('#resend').onclick = () => resend(false);
    if (q.get('resend')) resend(true); else cooldown(60);

    $('#f').onsubmit = async e => {
      e.preventDefault();
      const code = $('#f').code.value.trim();
      if (!/^\d{6}$/.test(code)) return toast('Enter the 6-digit code', 'danger');
      try { await api('/auth/verify-email', 'POST', { email, code }); flash('Email verified! Your account is ready. Please log in.'); location.href = 'login.html'; }
      catch (x) { toast(x.message || 'Verification failed', 'danger'); }
    };
  </script>
</body>

</html>
