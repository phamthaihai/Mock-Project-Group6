name: Deploy SkillTrail to Pages

on:
  push:
    branches: [feature/learnhub-frontend]
    paths: ['skilltrail-frontend/src/main/resources/static/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skilltrail-frontend/src/main/resources/static
      - id: deployment
        uses: actions/deploy-pages@v4