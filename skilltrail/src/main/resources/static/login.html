<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme.js"></script>
  <script>if (localStorage.getItem('user') || sessionStorage.getItem('user')) location.replace('index.html');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <title>SkillTrail - Login</title>
</head>

<body>
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width:440px">
      <form id="f" class="glass p-4">
        <h2 class="mb-3">Login</h2>
        <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
        <div class="position-relative mb-2">
          <input name="password" type="password" class="form-control pe-5" placeholder="Password" required>
          <button type="button" id="pwToggle" class="btn btn-link position-absolute top-0 end-0 h-100 px-3 text-secondary" aria-label="Show password" title="Show password"><i class="bi bi-eye"></i></button>
        </div>
        <label class="form-check mb-3"><input name="remember" type="checkbox" class="form-check-input"> <span class="form-check-label">Remember me</span></label>
        <button class="btn btn-primary w-100">Login</button>
        <div class="or-sep"><span>or</span></div>
        <div id="gsi" class="mb-1"></div>
        <p class="small mt-3 mb-1">No account? <a href="signup.html">Sign up</a></p>
        <p class="small text-secondary mb-2">Demo account (click to fill):</p>
        <div class="d-flex gap-2 flex-wrap"><button type="button"
            class="btn btn-sm btn-outline-light" data-fill="admin@skilltrail.com|admin123">Admin</button></div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    if (state.user) location.href = 'index.html';
    $('#f').addEventListener('click', e => { const b = e.target.closest('[data-fill]'); if (!b) return; const [em, pw] = b.dataset.fill.split('|'); $('#f').email.value = em; $('#f').password.value = pw; });
    $('#f').onsubmit = async e => {
      e.preventDefault();
      try {
        const { remember, ...creds } = formData(e.target), r = await api('/auth/login', 'POST', creds);
        setSession(r.user, r.token, !!remember); flash('Welcome to home page!');
        const n = new URLSearchParams(location.search).get('next');
        location.href = n && /^[\w.\-]+\.html(\?[\w=&%.\-]*)?$/.test(n) ? n : r.user.role === 'ADMIN' ? 'admin.html' : 'index.html';
      } catch (x) { toast(x.message || 'Login failed', 'danger'); }
    };
    $('#pwToggle').onclick = () => {
      const i = $('#f').password, show = i.type === 'password'; i.type = show ? 'text' : 'password';
      $('#pwToggle').innerHTML = '<i class="bi ' + (show ? 'bi-eye-slash' : 'bi-eye') + '"></i>';
      $('#pwToggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password'); $('#pwToggle').title = show ? 'Hide password' : 'Show password';
    };
    initGoogleButton($('#gsi'));
  </script>
</body>

</html>
