spring.application.name=group6
spring.datasource.url=${SKILLTRAIL_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SkillTrail;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SKILLTRAIL_DB_USERNAME:sa}
spring.datasource.password=${SKILLTRAIL_DB_PASSWORD}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
