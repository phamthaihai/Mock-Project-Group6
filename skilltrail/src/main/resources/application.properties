spring.application.name=group6
spring.datasource.url=${SKILLTRAIL_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SkillTrail;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SKILLTRAIL_DB_USERNAME:sa}
spring.datasource.password=${SKILLTRAIL_DB_PASSWORD}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


spring.mail.host=${SKILLTRAIL_MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${SKILLTRAIL_MAIL_USERNAME}
spring.mail.password=${SKILLTRAIL_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# REST API (Live API mode)
skilltrail.jwt.secret=${SKILLTRAIL_JWT_SECRET:skilltrail-dev-secret-change-me-before-deploying}
skilltrail.jwt.days=7

skilltrail.google.client-id=${SKILLTRAIL_GOOGLE_CLIENT_ID:387986591955-kkcc9gpidmqiam05l6ash61vfl5sh27v.apps.googleusercontent.com}
