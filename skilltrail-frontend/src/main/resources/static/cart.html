<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
    <title>SkillTrail - Your cart</title>
    <style>
        .pay-opt { display: flex; align-items: center; gap: 0.7rem; padding: 0.9rem 1rem; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
        .pay-opt i { font-size: 1.4rem; color: var(--brand2); }
        .pay-opt.active { border-color: var(--brand1); background: rgba(109, 93, 252, 0.15); }
        .qr { width: 150px; height: 150px; margin: 0 auto; border: 8px solid #fff; border-radius: 8px; background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
        .ok { width: 84px; height: 84px; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 50%; background: #22c55e; font-size: 2.8rem; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45); }
        .receipt td { padding: 0.45rem 0; border-color: rgba(255, 255, 255, 0.08); }
        .cart-thumb { width: 120px; height: 72px; flex: 0 0 120px; border-radius: 10px; overflow: hidden; }
        .cart-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @media (max-width: 576px) { .cart-thumb { width: 84px; height: 56px; flex-basis: 84px; } }
    </style>
</head>

<body>
    <main class="flex-grow-1" id="page">
        <div class="text-center p-5">
            <div class="spinner-border"></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        const LABEL = { CARD: 'Credit / debit card', EWALLET: 'E-wallet', BANK: 'Bank transfer', DEMO: 'Demo payment' };
        let cart = { items: [], count: 0, total: 0 }, step = 'cart', method = 'CARD', paying = false;

        const changed = () => document.dispatchEvent(new Event('cartchange'));
        const empty = () => `<div class="container py-5" style="max-width:640px"><div class="empty-state glass p-5">
            <i class="bi bi-cart-x"></i><h3 class="h4 mt-3">Your cart is empty</h3>
            <p class="text-secondary">Find a course you like and add it here to check out several at once.</p>
            <a href="index.html#courses" class="btn btn-primary">Browse courses</a></div></div>`;

        function row(c) {
            return `<div class="glass p-3 mb-3 d-flex gap-3 align-items-center">
              <a href="course.html?id=${c.courseId}" class="cart-thumb ${catClass(c.category)}">${imgTag(c)}</a>
              <div class="flex-grow-1 min-w-0">
                <a href="course.html?id=${c.courseId}" class="text-reset text-decoration-none fw-semibold">${esc(c.title)}</a>
                <div class="small text-secondary">${esc(c.instructor.fullName)} · ${c.durationHours}h · ${esc(c.level)}</div>
                <button class="btn btn-sm btn-link text-danger p-0 mt-1" data-act="remove" data-id="${c.courseId}"><i class="bi bi-trash"></i> Remove</button>
              </div>
              <div class="fw-bold text-nowrap">${money(c.price)}</div></div>`;
        }
        const summary = (btn) => `<div class="glass p-4 sticky-panel">
              <h5 class="mb-3">Order summary</h5>
              <div class="d-flex justify-content-between"><span class="text-secondary">${cart.count} course${cart.count === 1 ? '' : 's'}</span><span>${money(cart.total)}</span></div>
              <div class="d-flex justify-content-between"><span class="text-secondary">Discount</span><span>0 ₫</span></div><hr>
              <div class="d-flex justify-content-between fs-5 fw-bold mb-3"><span>Total</span><span>${money(cart.total)}</span></div>${btn}
              <ul class="checks small mt-3 mb-0"><li><i class="bi bi-infinity"></i> Lifetime access</li><li><i class="bi bi-award-fill"></i> Certificate of completion</li><li><i class="bi bi-lock-fill"></i> Secure checkout (demo)</li></ul></div>`;

        function drawCart() {
            if (!cart.count) { $('#page').innerHTML = empty(); return; }
            $('#page').innerHTML = `<div class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
              <div><span class="eyebrow">SHOPPING CART</span><h2 class="mt-1 mb-0">Your cart</h2></div>
              <a href="index.html#courses" class="btn btn-outline-light btn-sm"><i class="bi bi-plus-lg"></i> Add more courses</a></div>
              <div class="row g-4"><div class="col-lg-8">${cart.items.map(row).join('')}
                <button class="btn btn-sm btn-outline-danger" data-act="clear"><i class="bi bi-x-circle"></i> Clear cart</button></div>
              <div class="col-lg-4">${summary(cart.total > 0
                ? '<button class="btn btn-primary btn-lg w-100" data-act="toPay">Proceed to payment</button>'
                : '<button class="btn btn-primary btn-lg w-100" data-act="freeCheckout">Enroll in all (free)</button>')}</div></div></div>`;
        }

        function drawPay() {
            $('#page').innerHTML = `<div class="container py-5"><a href="#" class="text-secondary small" data-act="toCart"><i class="bi bi-arrow-left"></i> Back to cart</a>
              <h2 class="mt-2 mb-4">Checkout</h2><div class="row g-4"><div class="col-lg-7">
               <div class="glass p-4 mb-4"><h5 class="mb-3">Payment method</h5>
                <div class="row g-2 mb-4">
                 <div class="col-sm-4"><div class="pay-opt${method === 'CARD' ? ' active' : ''}" data-m="CARD"><i class="bi bi-credit-card"></i> Card</div></div>
                 <div class="col-sm-4"><div class="pay-opt${method === 'EWALLET' ? ' active' : ''}" data-m="EWALLET"><i class="bi bi-wallet2"></i> E-wallet</div></div>
                 <div class="col-sm-4"><div class="pay-opt${method === 'BANK' ? ' active' : ''}" data-m="BANK"><i class="bi bi-bank"></i> Bank transfer</div></div>
                </div>
                <div id="p-CARD" class="${method === 'CARD' ? '' : 'd-none'}">
                 <div class="alert alert-warning py-2 small"><i class="bi bi-exclamation-triangle"></i> Demo only. Never enter real card details. Nothing here is stored or sent.</div>
                 <input id="cname" class="form-control mb-2" placeholder="Name on card" autocomplete="off">
                 <input id="cn" class="form-control mb-2" placeholder="Card number (16 digits)" inputmode="numeric" maxlength="19" autocomplete="off">
                 <div class="row g-2"><div class="col-6"><input id="ce" class="form-control" placeholder="MM/YY" maxlength="5" autocomplete="off"></div><div class="col-6"><input id="cv" class="form-control" placeholder="CVC" inputmode="numeric" maxlength="4" autocomplete="off"></div></div>
                </div>
                <div id="p-EWALLET" class="${method === 'EWALLET' ? '' : 'd-none'} text-center">
                 <div class="d-flex justify-content-center gap-2 mb-3"><span class="tagchip">MoMo</span><span class="tagchip">ZaloPay</span><span class="tagchip">ShopeePay</span></div>
                 <div class="qr mb-2"></div><p class="small text-secondary mb-0">Scan with your e-wallet app (demo QR), then press Pay.</p>
                </div>
                <div id="p-BANK" class="${method === 'BANK' ? '' : 'd-none'}">
                 <p class="small text-secondary">Transfer the exact amount, then press Pay. Demo details:</p>
                 <table class="table table-sm mb-0"><tr><td class="text-secondary">Bank</td><td>Demo Bank</td></tr><tr><td class="text-secondary">Account</td><td>0123 456 789</td></tr><tr><td class="text-secondary">Name</td><td>LEARNHUB CO., LTD</td></tr><tr><td class="text-secondary">Reference</td><td>LH-CART-${esc(state.user.userId)}</td></tr></table>
                </div>
               </div>
               <button class="btn btn-primary btn-lg w-100 pbtn" data-act="pay">Pay ${money(cart.total)}</button>
               <div class="text-center text-secondary small my-3">or</div>
               <button class="btn btn-outline-warning w-100 pbtn" data-act="demo"><i class="bi bi-lightning-charge"></i> Demo payment (skip payment)</button>
               <p class="small text-secondary text-center mt-2 mb-0">Demo payment enrolls you instantly without paying.</p>
              </div><div class="col-lg-5">${summary('')}
              <div class="glass p-3 mt-3 small">${cart.items.map(c => `<div class="d-flex justify-content-between gap-2"><span class="text-truncate">${esc(c.title)}</span><span class="text-nowrap">${money(c.price)}</span></div>`).join('')}</div></div></div></div>`;
        }

        function cardError() {
            const n = $('#cn').value.replace(/\s/g, ''), m = $('#ce').value.match(/^(\d{2})\/(\d{2})$/);
            if (!$('#cname').value.trim()) return 'Enter the name on the card';
            if (!/^\d{16}$/.test(n)) return 'Card number must have 16 digits';
            if (!m || +m[1] < 1 || +m[1] > 12) return 'Expiry must be in MM/YY format';
            if (!/^\d{3,4}$/.test($('#cv').value)) return 'Enter a valid CVC';
            return '';
        }

        async function checkout(m, btn) {
            if (paying) return; paying = true;
            const label = btn?.innerHTML; $$('.pbtn').forEach(x => x.disabled = true); if (btn) btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
            try {
                await new Promise(r => setTimeout(r, m === 'DEMO' ? 300 : 1200));
                const r = await api('/cart/checkout', 'POST', { paymentMethod: m });
                changed(); success(r, m);
            } catch (x) { toast(x.message || 'Checkout failed', 'danger'); if (btn) btn.innerHTML = label; $$('.pbtn').forEach(y => y.disabled = false); }
            finally { paying = false; }
        }

        function success(r, m) {
            const skipped = r.skipped?.length ? `<div class="alert alert-warning small text-start">Skipped (no longer available): ${r.skipped.map(s => esc(s.title)).join(', ')}</div>` : '';
            $('#page').innerHTML = `<div class="container py-5" style="max-width:660px"><div class="glass p-4 p-md-5 text-center">
              <div class="ok"><i class="bi bi-check-lg"></i></div><h2>${m === 'DEMO' ? 'Demo enrollment complete' : r.total > 0 ? 'Payment successful' : 'You are enrolled'}</h2>
              <p class="text-secondary">You are now enrolled in ${r.items.length} course${r.items.length === 1 ? '' : 's'} and can start learning right away.</p>${skipped}
              <table class="table receipt text-start my-4">
               ${r.orderNumber ? `<tr><td class="text-secondary">Order number</td><td class="text-end">${esc(r.orderNumber)}</td></tr>` : ''}
               <tr><td class="text-secondary align-top">Courses</td><td class="text-end">${r.items.map(i => esc(i.title)).join('<br>')}</td></tr>
               <tr><td class="text-secondary">Method</td><td class="text-end">${r.total > 0 ? LABEL[m] : 'No payment needed'}</td></tr>
               <tr><td class="text-secondary">Amount</td><td class="text-end">${m === 'DEMO' && r.total > 0 ? money(r.total) + ' (not charged)' : money(r.total)}</td></tr>
               <tr><td class="text-secondary">Date</td><td class="text-end">${new Date().toLocaleString()}</td></tr></table>
              <a href="my-courses.html" class="btn btn-primary btn-lg w-100">Go to My Learning</a><a href="index.html#courses" class="btn btn-outline-light w-100 mt-2">Keep browsing</a></div></div>`;
            window.scrollTo(0, 0);
        }

        async function load() {
            cart = await api('/cart'); step = 'cart'; drawCart();
        }

        $('#page').onclick = async e => {
            const o = e.target.closest('.pay-opt');
            if (o) { method = o.dataset.m; $$('.pay-opt').forEach(x => x.classList.toggle('active', x === o)); ['CARD', 'EWALLET', 'BANK'].forEach(k => $('#p-' + k).classList.toggle('d-none', k !== method)); return; }
            const b = e.target.closest('[data-act]'); if (!b) return; e.preventDefault();
            const act = b.dataset.act;
            try {
                if (act === 'remove') { await api('/cart/' + b.dataset.id, 'DELETE'); toast('Removed from cart', 'info'); changed(); await load(); }
                else if (act === 'clear') {
                    if (!await confirmBox('Remove all courses from your cart?', { title: 'Clear cart', confirmText: 'Clear' })) return;
                    await api('/cart', 'DELETE'); changed(); await load();
                }
                else if (act === 'toPay') { step = 'pay'; drawPay(); window.scrollTo(0, 0); }
                else if (act === 'toCart') { await load(); }
                else if (act === 'freeCheckout') await checkout(null, b);
                else if (act === 'demo') await checkout('DEMO', b);
                else if (act === 'pay') { const m = method === 'CARD' ? cardError() : ''; if (m) return toast(m, 'warning'); await checkout(method, b); }
            } catch (x) { toast(x.message || 'Something went wrong', 'danger'); }
        };
        $('#page').oninput = e => {
            if (e.target.id === 'cn') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
            if (e.target.id === 'ce') { let v = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; }
        };

        if (guard()) (async () => {
            try {
                if (state.user.role === 'ADMIN') { flash('Admins enroll without payment, so there is no cart.', 'info'); return location.href = 'index.html#courses'; }
                await load();
            } catch (x) { $('#page').innerHTML = '<p class="text-center p-5 mb-0">' + esc(x.message || 'Could not load your cart') + '</p>'; }
        })();
    </script>
</body>

</html>
