<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme.js"></script>
  <script>if (localStorage.getItem('user') || sessionStorage.getItem('user')) location.replace('index.html');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <title>SkillTrail - Forgot password</title>
</head>

<body>
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width:440px">
      <form id="f1" class="glass p-4">
        <h2 class="mb-2">Forgot password</h2>
        <p class="small text-secondary">Enter your account email and we'll send you a 6-digit reset code.</p>
        <input name="email" type="email" class="form-control mb-3" placeholder="Email" required>
        <button class="btn btn-primary w-100">Send reset code</button>
        <p class="small mt-3 mb-0"><a href="login.html">Back to login</a></p>
      </form>
      <form id="f2" class="glass p-4 d-none">
        <h2 class="mb-2">Reset password</h2>
        <p class="small text-secondary" id="hint"></p>
        <input name="code" class="form-control mb-2" placeholder="6-digit code" inputmode="numeric" maxlength="6" pattern="\d{6}" required>
        <input name="newPassword" type="password" class="form-control mb-2" placeholder="New password (min 6)" minlength="6" required>
        <input name="confirm" type="password" class="form-control mb-3" placeholder="Confirm new password" required>
        <button class="btn btn-primary w-100">Reset password</button>
        <p class="small mt-3 mb-0"><a href="forgot.html">Use a different email</a> · <a href="login.html">Back to login</a></p>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    let email = '';
    $('#f1').onsubmit = async e => {
      e.preventDefault(); email = formData(e.target).email.trim();
      try {
        const r = await api('/auth/forgot-password', 'POST', { email });
        $('#f1').classList.add('d-none'); $('#f2').classList.remove('d-none');
        $('#hint').textContent = r.message;
        if (r.demoCode) $('#hint').innerHTML += ' <br><b>Demo mode (no mailbox): your code is ' + esc(r.demoCode) + '</b>';
      } catch (x) { toast(x.message || 'Request failed', 'danger'); }
    };
    $('#f2').onsubmit = async e => {
      e.preventDefault();
      const { confirm, ...d } = formData(e.target);
      if (confirm !== d.newPassword) return toast('Passwords do not match', 'danger');
      try { await api('/auth/reset-password', 'POST', { email, ...d }); flash('Password reset. Please log in.'); location.href = 'login.html'; }
      catch (x) { toast(x.message || 'Reset failed', 'danger'); }
    };
  </script>
</body>

</html>
