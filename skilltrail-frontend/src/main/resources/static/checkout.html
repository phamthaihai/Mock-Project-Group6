<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>SkillTrail - Checkout</title>
    <style>
        .pay-opt {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.9rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .pay-opt i {
            font-size: 1.4rem;
            color: var(--brand2);
        }

        .pay-opt.active {
            border-color: var(--brand1);
            background: rgba(109, 93, 252, 0.15);
        }

        .qr {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border: 8px solid #fff;
            border-radius: 8px;
            background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 20px 20px;
        }

        .ok {
            width: 84px;
            height: 84px;
            margin: 0 auto 1rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #22c55e;
            font-size: 2.8rem;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45);
        }

        .receipt td {
            padding: 0.45rem 0;
            border-color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body>
    <main class="flex-grow-1" id="page">
        <div class="text-center p-5">
            <div class="spinner-border"></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get('id');
        const LABEL = { CARD: 'Credit / debit card', EWALLET: 'E-wallet', BANK: 'Bank transfer', DEMO: 'Demo payment' };
        let c, method = 'CARD';

        function draw() {
            const total = money(c.price);
            $('#page').innerHTML = `<div class="container py-5"><a href="course.html?id=${id}" class="text-secondary small"><i class="bi bi-arrow-left"></i> Back to course</a>
    <h2 class="mt-2 mb-4">Checkout</h2><div class="row g-4">
     <div class="col-lg-7">
      <div class="glass p-4 mb-4"><h5 class="mb-3">Payment method</h5>
       <div class="row g-2 mb-4">
        <div class="col-sm-4"><div class="pay-opt active" data-m="CARD"><i class="bi bi-credit-card"></i> Card</div></div>
        <div class="col-sm-4"><div class="pay-opt" data-m="EWALLET"><i class="bi bi-wallet2"></i> E-wallet</div></div>
        <div class="col-sm-4"><div class="pay-opt" data-m="BANK"><i class="bi bi-bank"></i> Bank transfer</div></div>
       </div>
       <div id="p-CARD">
        <div class="alert alert-warning py-2 small"><i class="bi bi-exclamation-triangle"></i> Demo only. Never enter real card details. Nothing here is stored or sent.</div>
        <input id="cname" class="form-control mb-2" placeholder="Name on card" autocomplete="off">
        <input id="cn" class="form-control mb-2" placeholder="Card number (16 digits)" inputmode="numeric" maxlength="19" autocomplete="off">
        <div class="row g-2"><div class="col-6"><input id="ce" class="form-control" placeholder="MM/YY" maxlength="5" autocomplete="off"></div><div class="col-6"><input id="cv" class="form-control" placeholder="CVC" inputmode="numeric" maxlength="4" autocomplete="off"></div></div>
       </div>
       <div id="p-EWALLET" class="d-none text-center">
        <div class="d-flex justify-content-center gap-2 mb-3"><span class="tagchip">MoMo</span><span class="tagchip">ZaloPay</span><span class="tagchip">ShopeePay</span></div>
        <div class="qr mb-2"></div><p class="small text-secondary mb-0">Scan with your e-wallet app (demo QR), then press Pay.</p>
       </div>
       <div id="p-BANK" class="d-none">
        <p class="small text-secondary">Transfer the exact amount, then press Pay. Demo details:</p>
        <table class="table table-sm mb-0"><tr><td class="text-secondary">Bank</td><td>Demo Bank</td></tr><tr><td class="text-secondary">Account</td><td>0123 456 789</td></tr><tr><td class="text-secondary">Name</td><td>LEARNHUB CO., LTD</td></tr><tr><td class="text-secondary">Reference</td><td>LH-${esc(id)}-${esc(state.user.userId)}</td></tr></table>
       </div>
      </div>
      <button id="payBtn" class="btn btn-primary btn-lg w-100 pbtn">Pay ${total}</button>
      <div class="text-center text-secondary small my-3">or</div>
      <button id="demoBtn" class="btn btn-outline-warning w-100 pbtn"><i class="bi bi-lightning-charge"></i> Demo payment (skip payment)</button>
      <p class="small text-secondary text-center mt-2 mb-0">Demo payment enrolls you instantly without paying.</p>
     </div>
     <div class="col-lg-5"><div class="glass p-4 sticky-panel">
      <h5 class="mb-3">Order summary</h5>
      <div class="d-flex gap-3 mb-3"><div class="thumb ${catClass(c.category)}">${imgTag(c)}</div><div><div class="fw-semibold">${esc(c.title)}</div><small class="text-secondary">${esc(c.instructor.fullName)} · ${c.durationHours}h · ${esc(c.level)}</small></div></div>
      <div class="d-flex justify-content-between"><span class="text-secondary">Course price</span><span>${total}</span></div>
      <div class="d-flex justify-content-between"><span class="text-secondary">Discount</span><span>${money(0).replace('Free', '0 ₫')}</span></div><hr>
      <div class="d-flex justify-content-between fs-5 fw-bold"><span>Total</span><span>${total}</span></div>
      <ul class="checks small mt-3 mb-0"><li><i class="bi bi-infinity"></i> Lifetime access</li><li><i class="bi bi-award-fill"></i> Certificate of completion</li><li><i class="bi bi-lock-fill"></i> Secure checkout (demo)</li></ul>
     </div></div>
    </div></div>`;
        }

        function cardError() {
            const n = $('#cn').value.replace(/\s/g, ''), m = $('#ce').value.match(/^(\d{2})\/(\d{2})$/);
            if (!$('#cname').value.trim()) return 'Enter the name on the card';
            if (!/^\d{16}$/.test(n)) return 'Card number must have 16 digits';
            if (!m || +m[1] < 1 || +m[1] > 12) return 'Expiry must be in MM/YY format';
            if (!/^\d{3,4}$/.test($('#cv').value)) return 'Enter a valid CVC';
            return '';
        }

        async function pay(m, demo) {
            const b = demo ? $('#demoBtn') : $('#payBtn'), label = b.innerHTML;
            $$('.pbtn').forEach(x => x.disabled = true); b.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
            try {
                await new Promise(r => setTimeout(r, demo ? 300 : 1200));
                success(await api('/courses/' + id + '/enroll', 'POST', { paymentMethod: m }), m);
            } catch (x) { toast(x.message || 'Payment failed', 'danger'); b.innerHTML = label; $$('.pbtn').forEach(y => y.disabled = false); }
        }

        function success(en, m) {
            $('#page').innerHTML = `<div class="container py-5" style="max-width:620px"><div class="glass p-4 p-md-5 text-center">
      <div class="ok"><i class="bi bi-check-lg"></i></div><h2>${m === 'DEMO' ? 'Demo enrollment complete' : 'Payment successful'}</h2>
      <p class="text-secondary">You are now enrolled and can start learning right away.</p>
      <table class="table receipt text-start my-4"><tr><td class="text-secondary">Order number</td><td class="text-end">LH-${String(en.enrollmentId).padStart(6, '0')}</td></tr>
       <tr><td class="text-secondary">Course</td><td class="text-end">${esc(c.title)}</td></tr><tr><td class="text-secondary">Method</td><td class="text-end">${LABEL[m]}</td></tr>
       <tr><td class="text-secondary">Amount</td><td class="text-end">${m === 'DEMO' ? money(c.price) + ' (not charged)' : money(c.price)}</td></tr><tr><td class="text-secondary">Date</td><td class="text-end">${new Date().toLocaleString()}</td></tr></table>
      <a href="course.html?id=${id}#content" class="btn btn-primary btn-lg w-100">Start learning</a><a href="profile.html" class="btn btn-outline-light w-100 mt-2">Go to My Learning</a></div></div>`;
            window.scrollTo(0, 0);
        }

        $('#page').onclick = e => {
            const o = e.target.closest('.pay-opt');
            if (o) { method = o.dataset.m; $$('.pay-opt').forEach(x => x.classList.toggle('active', x === o));['CARD', 'EWALLET', 'BANK'].forEach(k => $('#p-' + k).classList.toggle('d-none', k !== method)); return; }
            if (e.target.closest('#demoBtn')) return pay('DEMO', true);
            if (e.target.closest('#payBtn')) { const m = method === 'CARD' ? cardError() : ''; return m ? toast(m, 'warning') : pay(method, false); }
        };
        $('#page').oninput = e => {
            if (e.target.id === 'cn') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
            if (e.target.id === 'ce') { let v = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; }
        };

        if (guard()) (async () => {
            try {
                if (state.user.role === 'ADMIN') { flash('Admins enroll without payment. Use the Enroll button on the course page.', 'info'); return location.href = 'course.html?id=' + id; }
                c = await api('/courses/' + id);
                if ((await api('/courses/' + id + '/progress')).enrolled) { flash('You are already enrolled in this course', 'info'); return location.href = 'course.html?id=' + id; }
                if (c.price === 0) return location.href = 'course.html?id=' + id;
                draw();
            } catch (x) { $('#page').innerHTML = '<p class="text-center p-5 mb-0">' + esc(x.message || 'Course not found') + '</p>'; }
        })();
    </script>
</body>

</html>
