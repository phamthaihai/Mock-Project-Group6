<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>SkillTrail - Profile</title>
</head>

<body>
  <main class="flex-grow-1 container py-5" style="max-width:900px">
    <div class="row g-4">
      <div class="col-md-6">
        <form id="info" class="glass p-4 h-100">
          <h4 class="mb-3">My Profile</h4>
          <div class="profile-avatar-wrap mb-3"><img id="avatarPreview" class="profile-avatar"
              alt="Your profile picture">
            <div><label for="avatarFile" class="btn btn-outline-light btn-sm"><i class="bi bi-camera"></i> Change
                picture</label><input id="avatarFile" type="file" accept="image/*" hidden>
              <div class="small text-secondary mt-1">JPG or PNG · stored in this browser in mock mode</div><button
                type="button" id="removeAvatar" class="btn btn-link btn-sm text-secondary p-0 mt-1">Remove
                picture</button>
            </div>
          </div>
          <label class="form-label small">Full name</label><input name="fullName" class="form-control mb-2"
            maxlength="100" required>
          <label class="form-label small">Email</label><input name="email" class="form-control mb-3" disabled>
          <button class="btn btn-primary">Save changes</button>
        </form>
      </div>
      <div class="col-md-6">
        <form id="pw" class="glass p-4 h-100">
          <h4 class="mb-3">Change Password</h4>
          <input name="currentPassword" type="password" class="form-control mb-2" placeholder="Current password"
            required>
          <input name="newPassword" type="password" class="form-control mb-2" placeholder="New password (min 6)"
            minlength="6" required>
          <input name="confirm" type="password" class="form-control mb-3" placeholder="Confirm new password" required>
          <button class="btn btn-primary">Update password</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-4"><a href="my-courses.html" class="btn btn-outline-light">Go to My Courses</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    if (guard()) {
      const paintAvatar = () => { const u = state.user; const img = $('#avatarPreview'); if (u.avatar) { img.src = u.avatar; img.classList.remove('avatar-empty'); } else { img.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.fullName || 'Learner') + '&background=6658d3&color=fff&size=240'; img.classList.add('avatar-empty'); } };
      paintAvatar();
      $('#avatarFile').addEventListener('change', e => { const file = e.target.files?.[0]; if (!file) return; if (!file.type.startsWith('image/')) return toast('Choose an image file', 'danger'); if (file.size > 1200 * 1024) return toast('Please choose an image smaller than 1.2 MB', 'warning'); const reader = new FileReader(); reader.onload = () => { setSession({ ...state.user, avatar: reader.result }, state.token); paintAvatar(); toast('Profile picture updated'); }; reader.readAsDataURL(file); });
      $('#removeAvatar').addEventListener('click', () => { const { avatar, ...u } = state.user; setSession(u, state.token); paintAvatar(); toast('Profile picture removed', 'info'); });
      $('#info').onsubmit = async e => {
        e.preventDefault();
        try { const u = await api('/users/me', 'PUT', { fullName: e.target.fullName.value }); setSession({ ...state.user, fullName: u.fullName }, state.token); flash('Profile updated!'); location.reload(); }
        catch (x) { toast(x.message || 'Update failed', 'danger'); }
      };
      $('#pw').onsubmit = async e => {
        e.preventDefault(); const d = formData(e.target);
        if (d.newPassword !== d.confirm) return toast('Passwords do not match', 'danger');
        try { await api('/users/me/password', 'PUT', { currentPassword: d.currentPassword, newPassword: d.newPassword }); e.target.reset(); toast('Password updated!'); }
        catch (x) { toast(x.message || 'Update failed', 'danger'); }
      };
      (async () => {
        try { const u = await api('/users/me'); $('#info').elements.fullName.value = u.fullName || ''; $('#info').elements.email.value = u.email || ''; const roleEl = $('#role'); if (roleEl) roleEl.textContent = u.role || ''; }
        catch (x) { toast(x.message || 'Failed to load profile', 'danger'); }
      })();
    }
  </script>
</body>

</html>
